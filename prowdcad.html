 ["Pen (P) — Internal Polygon / Line","Draws internal detail lines and polygons inside a pattern (style lines, pockets, pleats, fold refs) — not piece boundaries (those come from the shape tools). Click inside a pattern to set the start point; points snap onto the pattern outline when you're near it (a pink ring shows the snap). Keep clicking to add points. To finish: click the START point to complete a closed Internal Polygon, or double-click (or press Enter) to end an open Internal Line. Hold Ctrl to make a curve point, Shift to constrain the segment to horizontal / vertical / 45°. Esc cancels. The result attaches to the pattern and takes its Internal line style."],
 ["Curvature Pen (U) — smooth internal lines & edge editing","The Curvature pen has three roles. (1) Draw: click to add auto-smoothing points that flow into a curved INTERNAL line (attached to the piece you draw on) — no handles to manage; finish with Enter or double-click. (2) Edit edges: click anywhere on a piece's boundary to drop a curve point onto it, then drag to bend that edge. (3) Edit points: click an existing anchor to select it (Del removes it); double-click toggles corner ⇄ smooth. Boundaries themselves come from the shape tools, not the pen."],
 ["Converting points","Any curvature point is handle-free and re-fits automatically. To give it manual bézier handles (turning it into a Pen-style smooth point), double-click it or Alt-click it with the Select tool, or use Convert in the Point panel — then you can drag its handles. Double-click again to drop back to a plain corner."],
 ["Editing bézier handles","With the Select tool, click an anchor on the selected piece to show its magenta direction handles, then drag a handle ball to reshape — the grab zone is generous, so you don't have to click the ball dead-centre. By default the two handles stay mirrored (smooth): dragging one swings the other to the exact opposite side, so a single drag turns a lop-sided/broken point back into a smooth curve. Hold Alt while dragging to break the link and move one handle on its own (a cusp / change-direction point). Alt-click an anchor to convert corner⇄smooth, or use the Convert button in the Point panel. Handles move with the anchor, grade with the piece, and mirror correctly under Line/Piece Mirror."],
 ["Shape tools (M) — Rectangle / Ellipse / Rounded rect","A flyout group like Illustrator's. The toolbar shows the last-used shape with a small ▸ corner; right-click it (or long-press / press M while the shape tool is active) to open the flyout and pick Rectangle, Ellipse, or Rounded rectangle. Drag on the canvas to draw; hold Shift to constrain to a square / circle. Ellipses are made from four bézier anchors (true circle) and rounded-rect corners use bézier arcs, so every point stays editable, gradable, and mirror-able. Rounded-corner radius is set by cornerR (default 20 mm)."],
 ["Perpendicular line","Tool ⊥ (T). First click anchors on any piece edge or existing internal line — the line is locked exactly 90° to it. Second click sets the length. Press T to toggle single-side / both-sides. Result is an internal line (DXF layer 8), included in PDF and Plot exports."],
 ["Line mirror","Tool L. With a piece selected, click 2 points to define the mirror axis — a mirrored COPY is created with reversed winding. Notches, grain, internal lines and Movement Programs are all reflected (grading Δx/Δy vectors are properly mirrored across the axis)."],
 ["Piece mirror & symmetric edit","Tool Y. Click 2 points along the fold line. If the piece is already symmetric about that line, symmetric edit switches ON: dragging a point (or editing its X/Y, curve flag or Movement Program) automatically updates its twin, mirrored. If the piece is a HALF with its fold edge on the axis, it is unfolded into the full symmetric piece first. Right-click the piece with the Select tool → Cancel symmetric edit for independent (non-symmetric) editing; re-enable the same way."],
 ["Editing points","Select tool (V): click a piece, then drag its points. Point panel (sidebar) edits exact X/Y, curve flag and grading deltas. Delete key removes selected point or piece. Right-click a piece for symmetric edit, internal-line and delete options."],
 ["Movement Programs (grading rules)","Define measurements (name + base value) in the sidebar. Select a point and enter Δx/Δy per +1 unit of each measurement. Generate Size asks for target measurements and outputs a complete new pattern — pieces, seams, notches and grain lines recalculated."],
 ["Seam allowance","Per-piece value (piece panel). Displayed as a dashed offset — a true geometric offset (miter/bevel), not a scaled copy. Toggle from View → Seam. On AAMA/ASTM export the drafted outline is written as the sew line and the offset as the cut boundary."],
 ["Line styles & labels","Select a piece to open the Line Styles panel. Each of the four line types — Perimeter, Internal, Grain, Seam — has its own colour, thickness (pt) and, where applicable, line style (Solid / Dashed / Dotted / Dash-Dot). Grain carries an arrow style (Double / Single / None); Internal has a Cut-line flag; Seam shows the allowance width; Perimeter shows its read-only total length. Every type has a Label (text + font size) with a Print toggle — when on, it prints on the piece and is carried into the PDF export. Defaults follow tech-pack convention: perimeter black, internal blue, grain green, seam orange. Colours and weights are written into DXF (AutoCAD colour index) and PDF."],
 ["Notches & grain line","Notch tool (N): click on an edge. Notches are parametric (segment + position) so they survive grading. Grain tool (G): drag inside a piece to set the grain line."],
 ["Marker making","Load the active pattern into the marker (sidebar button). Instances honour Qty, Opposite X/Y (mirrored copies) and Rotation Allow. Drag to place; drops that overlap another piece's Buffer Size zone, or leave the fabric, snap back. R rotates 90° when allowed."],
 ["Marker modes","Marker = continuous fabric-width layout → Plot DXF at 1:1. A4 Tiles / US Letter / A0 = paged layouts → PDF at true scale with registration crosses, page numbers and a 10 mm glue overlap."],
 ["Shrinkage","Shrink X/Y % (marker sidebar) applies scale compensation 1/(1−s) to placed geometry and exports, at the marker stage only."],
 ["Import / Export","Import DXF / AAMA DXF / ASTM DXF (the exchange format every major apparel CAD — Gerber AccuMark, Lectra, Optitex, StyleCAD, CLO, PAD — can export), plus PLT/HPGL plotter files (40 units/mm, closed pen paths → pieces, open paths → internal lines) and SVG (1 unit = 1 mm assumed; closed paths/rects/circles/polygons → pieces, open paths/lines → internal lines; arcs approximated, transforms ignored — flatten in Illustrator first). Each import shows a report of what was recognised and skipped. Proprietary NATIVE files (.zip AccuMark, .pds Optitex, Lectra .mdl/.iba, .ai) can't be read directly — export DXF-AAMA/ASTM from that software instead. Export DXF flavours or PDF from Pattern Design; Plot DXF or tiled PDF from Marker Making. Native files: .wptn (pattern incl. grading rules), .wmrk (marker with embedded pattern)."],
 ["PRO — Measurement Chart (Shift+M)","TUKAdesign-style. Name a grade point with /m — e.g. 03 Hip/m/q2 — and the contour from that point to the NEXT grade (non-curve) point is measured. Same names on different pieces add up (front rise on panel + waistband). Count = piece quantity incl. opposite copies unless /q overrides it. You can also use the Measure tool to save straight (D), X, Y or along-contour measurements between any two points (also across pieces). Type targets and tolerance in the chart or import them from an order Excel. Export CSV for the spec sheet."],
 ["PRO — Move Points by area (Ctrl+Shift+U in TUKA layout)","Drag a rectangle round points (e.g. the hem ends of front and back legs), then type dX / dY. Internal line ends inside the rectangle move too. +X right, +Y down; −1 inch in Y shortens a leg from the hem by 1 inch. Single point: select it and press Q (Move Point)."],
 ["PRO — Alteration rules & Auto-alter (made-to-measure)","Rules are Movement Programs: drag a rectangle with Program by area (Shift+R) and set how far those points move per +1 unit of a parameter (e.g. hem points +Y 1 for Inseam; side-seam points ±X 0.25 for Hip on a 4-panel jean). Give the parameter the SAME name as the chart measurement. Order › Import order Excel reads the Neems Pattern Sheet (Preshrink Target table, warp/weft shrinkage, fabric width) and sets chart targets. Auto-alter then solves every programmed measurement to its target (Newton solver — curves, ×2 counts and multi-part measurements all land on target) and creates a NEW pattern named after the order. Rows without a rule are only checked."],
 ["PRO — Scale and Shrink (Shift+Enter)","Warp % is applied along each piece's grain line, weft % across it. ‘Proportional to 100%’ (TUKA): 10\" with 10% shrink → 11.111\" which washes back to exactly 10\". Result goes to a new pattern by default so the preshrink pattern stays."],
 ["PRO — Order chain","Order › Run order chain: altered Preshrink pattern → Postshrink pattern (order shrinkage) → marker at the order's fabric width, auto-nested with grain along the fabric length. File › Export order bundle saves .wptn, AAMA DXF, chart CSV, marker .wmrk, PLT and plot DXF."],
 ["PRO — DXF import from TUKAcad / Gerber / Lectra","AAMA/ASTM files with one BLOCK per piece are read with piece names (Piece Name: text), quantity, grain, notches, internals, drill holes, turn vs curve points and the sew line (seam allowance is derived from cut-to-sew distance). Export from TUKAcad: File › Export › DXF AAMA."],
 ["PRO — Keyboard layouts","Tools › Keyboard switches between the ProwdCAD layout and a TUKAdesign layout (M measure, Shift+M chart, Q move point, Ctrl+Shift+U move points, Shift+Enter scale/shrink, Home zoom all, End select, Ctrl+L / Shift+L flip, 9/0 rotate). Help › Hot keys lists the active layout. Undo Ctrl+Z / Redo Ctrl+Y in both."],
 ["Shortcuts","V select · P pen (internal lines) · U curvature pen (auto-smooth) · M rectangle/circle (again = swap) · T perpendicular (again = single/both) · L line mirror · Y piece mirror · N notch · G grain · C corner/curve override · R rotate (marker) · Enter finish line · Esc cancel · Del delete · dbl-click anchor = corner⇄smooth · right-click = piece menu · Space+drag / middle-drag pan · wheel zoom."],
];
function showHelpIndex(){
  dialog("Help — Index",`
    <input id="helpq" type="text" placeholder="Search help…" style="width:100%;margin-bottom:10px">
    <div id="helplist"></div>`,[{label:"Close",primary:true}]);
  const list=$("#helplist");
  const draw=q=>{q=(q||"").toLowerCase();
    list.innerHTML=HELP.filter(h=>!q||h[0].toLowerCase().includes(q)||h[1].toLowerCase().includes(q))
      .map(h=>`<h4>${h[0]}</h4><p>${h[1]}</p>`).join("")||`<p style="color:var(--dim)">No topics match.</p>`;};
  draw();$("#helpq").oninput=e=>draw(e.target.value);$("#helpq").focus();
}

/* Generate-size dialog (1.1) */
function showGenerateSize(){
  const p=activePattern();if(!p)return toast("No active pattern");
  if(!p.measurements.length)return toast("Add measurements first (Movement Programs)");
  dialog(`Generate size from “${p.name} — ${p.size}”`,`
    <div class="row"><label>New size name</label><input id="gs-name" type="text" value="" placeholder="e.g. L"></div>
    <h4>Target measurements (${S.units})</h4>
    ${p.measurements.map(m=>`<div class="row"><label>${m.name}</label>
      <input type="number" step="any" class="gs-m" data-id="${m.id}" value="${fmt(m.base)}">
      <span style="color:var(--dim);font:10px var(--mono)">base ${fmt(m.base)}</span></div>`).join("")}
    <p class="hintline">Outputs a complete NEW pattern: all pieces, seams, notches and grain lines recalculated from the Movement Programs.</p>`,
    [{label:"Cancel"},{label:"Generate pattern",primary:true,action:()=>{
      const name=$("#gs-name").value.trim()||"?";
      const targets={};$$(".gs-m").forEach(i=>targets[i.dataset.id]=toMM(i.value));
      const np=generateSize(p,name,targets);
      S.patterns.push(np);S.activePatternId=np.id;S.sel={piece:null,point:null,placement:null};
      toast(`New pattern generated: ${np.name} — ${np.size}`);render();
    }}]);
}

/* =========================================================
   SIDEBAR (design + marker)
   ========================================================= */
function buildSidebar(){
  const sb=$("#sidebar");sb.innerHTML="";
  if(S.workspace==="design")buildDesignSidebar(sb);else buildMarkerSidebar(sb);
}
function el(html){const d=document.createElement("div");d.innerHTML=html;return d.firstElementChild;}

function buildDesignSidebar(sb){
  const p=activePattern();
  /* --- pattern panel --- */
  const pp=el(`<div class="panel"><h3>Pattern <button class="pact" id="np">+ new</button></h3></div>`);
  if(S.patterns.length){
    const selHtml=`<div class="row"><select id="patsel">${S.patterns.map(x=>`<option value="${x.id}" ${x.id===S.activePatternId?"selected":""}>${x.name} — ${x.size}${x.derivedFrom?" (graded)":""}</option>`).join("")}</select></div>`;
    pp.appendChild(el(selHtml));
    if(p){
      pp.appendChild(el(`<div class="row"><label>Name</label><input id="patname" type="text" value="${p.name}"></div>`));
      pp.appendChild(el(`<div class="row"><label>Size</label><input id="patsize" type="text" value="${p.size}" style="max-width:70px"></div>`));
      pp.appendChild(el(`<div style="display:flex;gap:6px;margin-top:6px">
        <button class="btn full primary" id="gensize">Generate size…</button>
        <button class="btn sm" id="delpat" title="Delete pattern">🗑</button></div>`));
    }
  }else{
    pp.appendChild(el(`<p class="hintline">No pattern yet. Create one, open a .wptn, import a DXF — or load the demo T-shirt block to explore grading.</p>`));
    pp.appendChild(el(`<button class="btn full" id="demo" style="margin-top:6px">Load demo T-shirt block (M)</button>`));
  }
  sb.appendChild(pp);
  $("#np").onclick=()=>{const np=newPattern("Untitled","M");S.patterns.push(np);S.activePatternId=np.id;S.sel={piece:null,point:null,placement:null};render();};
  const d=$("#demo");if(d)d.onclick=()=>{loadDemo();render();};
  const ps=$("#patsel");if(ps)ps.onchange=e=>{S.activePatternId=e.target.value;S.sel={piece:null,point:null,placement:null};fitView("design");render();};
  const pn=$("#patname");if(pn)pn.onchange=e=>{p.name=e.target.value;render();};
  const pz=$("#patsize");if(pz)pz.onchange=e=>{p.size=e.target.value;render();};
  const gs=$("#gensize");if(gs)gs.onclick=showGenerateSize;
  const dp=$("#delpat");if(dp)dp.onclick=()=>{confirmDialog(`Delete pattern "${p.name} — ${p.size}"?`,()=>{S.patterns=S.patterns.filter(x=>x.id!==p.id);S.activePatternId=S.patterns.length?S.patterns[0].id:null;render();toast("Pattern deleted");},"Delete");};
  if(!p)return;

  /* --- alteration parameters (movement programs) --- */
  const mp=el(`<div class="panel"><h3>Alteration rules <button class="pact" id="addm">+ add</button></h3><div class="list" id="mlist"></div>
    <p class="hintline">Parameters that move programmed points (Point › Program by area). Give a rule the same name as a chart measurement and Auto-alter drives it to the order target. The number is the parameter value — only its change matters.</p></div>`);
  sb.appendChild(mp);
  const ml=$("#mlist");
  if(!p.measurements.length)ml.innerHTML=`<div class="list-item" style="color:var(--dim);cursor:default">none defined</div>`;
  p.measurements.forEach(m=>{
    const li=el(`<div class="list-item"><input type="text" value="${m.name}" style="flex:1;min-width:0;border:none;background:none;padding:0">
      <input type="number" step="any" value="${fmt(m.base)}" style="width:64px"><span style="color:var(--dim);font-size:10px">${S.units}</span>
      <button title="remove" style="color:var(--dim)">✕</button></div>`);
    const [nameI,baseI]=li.querySelectorAll("input");
    nameI.onchange=e=>{m.name=e.target.value;};
    baseI.onchange=e=>{m.base=toMM(e.target.value);render();};
    li.querySelector("button").onclick=()=>{p.measurements=p.measurements.filter(x=>x.id!==m.id);p.pieces.forEach(pc=>pc.points.forEach(pt=>{if(pt.grade)delete pt.grade[m.id];}));render();};
    ml.appendChild(li);
  });
  $("#addm").onclick=()=>{p.measurements.push({id:uid(),name:"measure "+(p.measurements.length+1),base:0});render();};

  /* --- order panel --- */
  if(p.order){const o=p.order;const t=Object.values(targetsOf(p)).filter(x=>x.target!=null).length;
    const op=el(`<div class="panel"><h3>Order</h3><div class="list"><div class="list-item" style="cursor:default;flex-direction:column;align-items:flex-start;gap:2px">
      <span>${esc(o.baseName||"")}</span><span class="sub" style="margin:0">${t} targets · warp ${((o.warp||0)*100).toFixed(1)}% weft ${((o.weft||0)*100).toFixed(1)}% · fabric ${o.fabricWidth?fmtU(o.fabricWidth):"?"}</span></div></div>
      <div style="display:flex;gap:6px;margin-top:6px"><button class="btn full primary" id="od-alter">Auto-alter</button><button class="btn full" id="od-chain">Full chain</button></div></div>`);
    sb.appendChild(op);$("#od-alter").onclick=()=>runAutoAlter(p);$("#od-chain").onclick=runOrderChain;}
  buildChartPanel(sb,p);
  /* --- pieces list --- */
  const plp=el(`<div class="panel"><h3>Pieces <span class="pact" style="cursor:default">${p.pieces.length}</span></h3><div class="list" id="plist"></div></div>`);
  sb.appendChild(plp);
  const pl=$("#plist");
  if(!p.pieces.length)pl.innerHTML=`<div class="list-item" style="color:var(--dim);cursor:default">none — use Draw tool (D)</div>`;
  p.pieces.forEach(pc=>{
    const li=el(`<div class="list-item ${pc.id===S.sel.piece?"active":""}">${pc.name}<span class="sub">×${pc.qty*(pc.oppositeX?2:1)*(pc.oppositeY?2:1)}</span></div>`);
    li.onclick=()=>{S.sel.piece=pc.id;S.sel.point=null;render();};
    pl.appendChild(li);
  });

  /* --- piece info --- */
  const pc=selPiece();
  if(pc){
    const pi=el(`<div class="panel"><h3>Piece — ${pc.name} <button class="pact" id="delpc">delete</button></h3>
      <div class="row"><label>Name</label><input id="pc-name" type="text" value="${pc.name}"></div>
      <div class="row"><label>Qty</label><input id="pc-qty" type="number" min="1" step="1" value="${pc.qty}"></div>
      <div class="row"><label>Seam allow.</label><input id="pc-seam" type="number" step="any" value="${fmt(pc.seam)}"><span style="color:var(--dim);font-size:10px">${S.units}</span></div>
      <div class="row"><label>Buffer size</label><input id="pc-buf" type="number" step="any" value="${fmt(pc.buffer)}"><span style="color:var(--dim);font-size:10px">${S.units}</span></div>
      <div class="row"><label>Rotation allow</label><input id="pc-rot" type="checkbox" ${pc.rotationAllow?"checked":""}></div>
      <div class="row"><label>Opposite X</label><input id="pc-ox" type="checkbox" ${pc.oppositeX?"checked":""}></div>
      <div class="row"><label>Opposite Y</label><input id="pc-oy" type="checkbox" ${pc.oppositeY?"checked":""}></div>
      <div class="row"><label>Symmetric edit</label><span style="font:11px var(--mono);color:${pc.sym&&pc.sym.enabled?"var(--accent)":"var(--dim)"}">${pc.sym?(pc.sym.enabled?"on (right-click to cancel)":"off (right-click to enable)"):"no axis — use Y tool"}</span></div>
      ${(pc.internals||[]).length?`<div class="row"><label>Internal lines</label><span style="font:11px var(--mono);color:var(--dim)">${pc.internals.length}</span></div>`:""}
    </div>`);
    sb.appendChild(pi);
    $("#delpc").onclick=()=>{confirmDialog(`Delete piece "${pc.name}"?`,()=>{p.pieces=p.pieces.filter(x=>x.id!==pc.id);S.sel.piece=null;S.sel.point=null;render();toast("Piece deleted");},"Delete");};
    $("#pc-name").onchange=e=>{pc.name=e.target.value;render();};
    $("#pc-qty").onchange=e=>{pc.qty=Math.max(1,parseInt(e.target.value)||1);render();};
    $("#pc-seam").onchange=e=>{pc.seam=toMM(e.target.value);render();};
    $("#pc-buf").onchange=e=>{pc.buffer=toMM(e.target.value);render();};
    $("#pc-rot").onchange=e=>{pc.rotationAllow=e.target.checked;};
    $("#pc-ox").onchange=e=>{pc.oppositeX=e.target.checked;render();};
    $("#pc-oy").onchange=e=>{pc.oppositeY=e.target.checked;render();};
    buildLineStylesPanel(sb,pc);

    /* --- point panel + movement program --- */
    if(S.sel.point!=null&&pc.points[S.sel.point]){
      const pt=pc.points[S.sel.point];
      const pp2=el(`<div class="panel"><h3>Point ${S.sel.point+1} of ${pc.points.length}</h3>
        <div class="row"><label>X</label><input id="pt-x" type="number" step="any" value="${fmt(pt.x)}"><span style="color:var(--dim);font-size:10px">${S.units}</span></div>
        <div class="row"><label>Y</label><input id="pt-y" type="number" step="any" value="${fmt(pt.y)}"><span style="color:var(--dim);font-size:10px">${S.units}</span></div>
        <div class="row"><label>Name</label><input id="pt-name" type="text" value="${esc(pt.name||"")}" placeholder="e.g. 03 Hip/m/q2"></div>
        <div class="row"><label>Type</label><span style="font:11px var(--mono);color:${hasHandle(pt)?"var(--accent)":"var(--dim)"}">${hasHandle(pt)?(pt.hIn&&pt.hOut?"smooth (bézier)":"hybrid"):"corner"}${pt.curve?" · curve":" · grade"}</span></div>
        <div style="display:flex;gap:6px;margin-bottom:6px"><button class="btn sm" id="pt-move">Move…</button><button class="btn sm" id="pt-grade">${pt.curve?"Make grade pt":"Make curve pt"}</button></div>
        <button class="btn full sm" id="pt-toggle" style="margin-bottom:6px">${hasHandle(pt)?"Convert to corner":"Convert to smooth"}</button>
        <h3 style="margin-top:10px">Movement Program</h3>
        ${p.measurements.length?`<table class="gradetbl"><tr><th>measurement</th><th>Δx / unit</th><th>Δy / unit</th></tr>
          ${p.measurements.map(m=>{const g=(pt.grade&&pt.grade[m.id])||{dx:0,dy:0};
            return `<tr><td style="color:var(--dim)">${m.name}</td>
              <td><input type="number" step="any" class="gr" data-m="${m.id}" data-a="dx" value="${g.dx||0}"></td>
              <td><input type="number" step="any" class="gr" data-m="${m.id}" data-a="dy" value="${g.dy||0}"></td></tr>`;}).join("")}
        </table><p class="hintline">Movement per +1 unit of the measurement (ratio). Set in bulk with Program by area (${keyFor("point.program")}).</p>`
        :`<p class="hintline">Define measurements above to program this point.</p>`}
      </div>`);
      sb.appendChild(pp2);
      $("#pt-x").onchange=e=>{const nx=toMM(e.target.value);moveHandlesWith(pt,nx-pt.x,0);pt.x=nx;syncTwin(pc,S.sel.point,twinIndex(pc,S.sel.point));render();};
      $("#pt-y").onchange=e=>{const ny=toMM(e.target.value);moveHandlesWith(pt,0,ny-pt.y);pt.y=ny;syncTwin(pc,S.sel.point,twinIndex(pc,S.sel.point));render();};
      $("#pt-toggle").onclick=()=>{toggleCorner(pc,S.sel.point);render();};
      $("#pt-name").onchange=e=>{pt.name=e.target.value.trim();render();};
      $("#pt-move").onclick=()=>movePointDialog(pc,S.sel.point);
      $("#pt-grade").onclick=()=>{pt.curve=!pt.curve;if(!pt.curve){pt.hIn=null;pt.hOut=null;}render();};
      $$(".gr").forEach(i=>i.onchange=e=>{
        const m=e.target.dataset.m,a=e.target.dataset.a;
        pt.grade=pt.grade||{};pt.grade[m]=pt.grade[m]||{dx:0,dy:0};
        pt.grade[m][a]=parseFloat(e.target.value)||0;
        syncTwin(pc,S.sel.point,twinIndex(pc,S.sel.point));   // mirrored Movement Program
        if(S.view.movement)render();
      });
    }
  }
}
/* ---- Line Styles editor (Perimeter / Internal / Grain / Seam) ---- */
function buildLineStylesPanel(sb,pc){
  normPieceStyles(pc);const st=pc.styles;
  const styleOpts=(sel,list)=>list.map(o=>`<option value="${o}" ${sel===o?"selected":""}>${o[0].toUpperCase()+o.slice(1)}</option>`).join("");
  const labelRows=(key)=>{const L=st[key].label;return `
    <div class="row"><label>Label</label><input class="ls" data-k="${key}" data-p="label.text" type="text" value="${(L.text||"").replace(/"/g,"&quot;")}" placeholder="(none)"></div>
    <div class="row"><label>Font size</label><input class="ls" data-k="${key}" data-p="label.fontSize" type="number" min="6" step="1" value="${L.fontSize}" style="max-width:64px">
      <label style="flex:0 0 auto;color:var(--dim)">print</label><input class="ls" data-k="${key}" data-p="label.visible" type="checkbox" ${L.visible?"checked":""}></div>`;};
  const common=(key,styles)=>`
    <div class="row"><label>Color</label><input class="ls" data-k="${key}" data-p="color" type="color" value="${st[key].color}" style="width:38px;height:24px;padding:1px">
      <input class="ls" data-k="${key}" data-p="color" type="text" value="${st[key].color}" style="flex:1;font-family:ui-monospace,monospace"></div>

function buildFloatTool(){

    b.className=S.tool===id?"active":"";
    b.onclick=()=>{if(S.tool===id&&id==="perp"){S.perpBoth=!S.perpBoth;buildFloatTool();renderStats();return;}setTool(id);};

  simple("curvepen","curvepen","Curvature pen (U) — click to add auto-smooth points; click an edge to insert a point; click a point to select (Del removes); double-click toggles corner");

  simple("piecemirror","piecemirror","Piece mirror (Y) — click 2 points on fold line → unfold or enable symmetric edit");
  ft.appendChild(el(`<div class="tsep"></div>`));
  [["notch","notch","Notch — click on an edge"],["grain","grain","Grain line — drag inside a piece"],["smooth","smooth","Smooth — click start then end corner point; click intermediate points to keep (red X); right-click to finish, Esc cancels."],
   ["measure","measure","Measure — click two points (snaps to anchors) · add to Measurement Chart"],["movepoints","movepoints","Move points by area — drag a rectangle, type dX/dY (TUKA Ctrl+Shift+U)"],["program","program","Program points by area — drag a rectangle, set the alteration rule (Δ per unit of a measurement)"]].forEach(([id,ic,tip])=>{
    const b=document.createElement("button");b.title=tip;b.innerHTML=toolIcon(ic);

const SHAPES=[
  ["rect","rect","Rectangle (M) — drag to draw; Shift = square"],
  ["ellipse","circle","Ellipse (M) — drag to draw; Shift = circle"],
  ["roundrect","roundrect","Rounded rectangle (M) — drag to draw; Shift = square"],
];
function buildShapeFlyout(ft){
  const wrap=document.createElement("div");wrap.className="flywrap";
  const active=SHAPES.find(s=>s[0]===S.shapeKind)||SHAPES[0];
  const b=document.createElement("button");
  b.title=active[2]+"  ·  hold / long-press for more shapes";
  b.innerHTML=toolIcon(active[1])+`<span class="flytri"></span>`;
  b.className=(S.tool==="shape")?"active":"";
  let holdT=null;
  const openFly=()=>{closeFly();const menu=document.createElement("div");menu.className="flymenu";
    SHAPES.forEach(([id,ic,tip])=>{const mb=document.createElement("button");mb.title=tip;mb.innerHTML=toolIcon(ic)+`<span class="flylabel">${id==="rect"?"Rectangle":id==="ellipse"?"Ellipse":"Rounded rect"}</span>`;
      mb.className=(S.shapeKind===id?"sel":"");
      mb.onclick=ev=>{ev.stopPropagation();S.shapeKind=id;closeFly();setTool("shape");};
      menu.appendChild(mb);});
    wrap.appendChild(menu);};
  b.onclick=()=>{ if(wrap.querySelector(".flymenu")){closeFly();return;} setTool("shape"); };
  b.oncontextmenu=e=>{e.preventDefault();openFly();};
  b.onpointerdown=()=>{holdT=setTimeout(openFly,320);};
  b.onpointerup=b.onpointerleave=()=>{clearTimeout(holdT);};
  wrap.appendChild(b);ft.appendChild(wrap);
}
function closeFly(){$$(".flymenu").forEach(m=>m.remove());}
document.addEventListener("click",e=>{if(!e.target.closest||!e.target.closest(".flywrap"))closeFly();});
function setTool(t){S.tool=t;if(t!=="pen"&&t!=="curvepen")cancelDraft();S.op=null;hideCtx();closeFly();buildFloatTool();updateCursor();renderStats();}
function updateCursor(){$("#svg").style.cursor=["pen","curvepen","shape","perp","linemirror","piecemirror","notch","grain","smooth","measure","movepoints","program"].includes(S.tool)?"crosshair":"default";}

/* =========================================================
   SVG RENDERING
   ========================================================= */
const SVGNS="http://www.w3.org/2000/svg";
function svgEl(tag,attrs,parent){const e=document.createElementNS(SVGNS,tag);for(const k in attrs)e.setAttribute(k,attrs[k]);if(parent)parent.appendChild(e);return e;}
function pathD(poly,close=true){if(!poly.length)return"";return "M"+poly.map(p=>p.x.toFixed(2)+" "+p.y.toFixed(2)).join("L")+(close?"Z":"");}
function vb(){return S.vb[S.workspace];}
function pxScale(){const r=$("#svg").getBoundingClientRect();return vb().w/Math.max(1,r.width);} // world mm per screen px
function fitView(ws,pad){
  const r=$("#svg").getBoundingClientRect();const ar=Math.max(.2,r.width/Math.max(1,r.height));
  let bb=null;
  if(ws==="design"){const p=activePattern();
    if(p&&p.pieces.length){const all=[];p.pieces.forEach(pc=>all.push(...samplePiece(pc)));if(all.length)bb=polyBBox(all);}
  }else if(S.marker){bb={x1:0,y1:0,x2:Math.max(2000,markerLength()+400),y2:S.marker.fabricWidth};bb.w=bb.x2;bb.h=bb.y2;}
  if(!bb||!isFinite(bb.w))bb={x1:0,y1:0,x2:1200,y2:900,w:1200,h:900};
  pad=pad||Math.max(bb.w,bb.h)*.12+60;
  let w=bb.w+pad*2,h=bb.h+pad*2;
  if(w/h<ar)w=h*ar;else h=w/ar;
  S.vb[ws]={x:bb.x1-(w-bb.w)/2,y:bb.y1-(h-bb.h)/2,w,h};
}
function render(){
  buildMenus();buildSidebar();buildFloatTool();updateCursor();
  $$(".tab").forEach(t=>t.classList.toggle("active",t.dataset.ws===S.workspace));
  $("#modebar").classList.toggle("show",S.workspace==="marker");
  $$(".mode-btn").forEach(b=>b.classList.toggle("active",b.dataset.mode===S.markerMode));
  if(!S.vb[S.workspace])fitView(S.workspace);
  const svg=$("#svg");svg.innerHTML="";
  const V=vb();svg.setAttribute("viewBox",`${V.x} ${V.y} ${V.w} ${V.h}`);
  /* white working area = effectively infinite white sheet (handles never fall off the paper) */
  svgEl("rect",{x:V.x-V.w*20,y:V.y-V.h*20,width:V.w*41,height:V.h*41,fill:"#ffffff"},svg);
  if(S.view.grid)drawGrid(svg,V);
  if(S.workspace==="design")renderDesign(svg);else renderMarker(svg);
  renderStats();
  histCheckpoint();
}
function drawGrid(svg,V){
  const step=S.units==="inch"?25.4:10; // 1cm or 1in minor
  const major=step*10;
  const g=svgEl("g",{},svg);
  const x0=Math.floor(V.x/step)*step,y0=Math.floor(V.y/step)*step;
  if(V.w/step>400)return; // too dense — skip
  for(let x=x0;x<=V.x+V.w;x+=step)
    svgEl("line",{x1:x,y1:V.y,x2:x,y2:V.y+V.h,stroke:Math.abs(x%major)<1e-6?"#d8d8dc":"#efeff2","stroke-width":pxScale()},g);
  for(let y=y0;y<=V.y+V.h;y+=step)
    svgEl("line",{x1:V.x,y1:y,x2:V.x+V.w,y2:y,stroke:Math.abs(y%major)<1e-6?"#d8d8dc":"#efeff2","stroke-width":pxScale()},g);
}
function drawNotch(g,piece,nt,stroke,sw){
  const p=pointOnSegment(piece,nt.seg,nt.t),tg=segTangent(piece,nt.seg,nt.t);
  const L=8; // 8mm notch
  svgEl("line",{x1:p.x-tg.y*L,y1:p.y+tg.x*L,x2:p.x+tg.y*L,y2:p.y-tg.x*L,stroke,"stroke-width":sw},g);
}
function drawGrain(g,gr,stroke,sw,arrow){
  svgEl("line",{x1:gr.x1,y1:gr.y1,x2:gr.x2,y2:gr.y2,stroke,"stroke-width":sw},g);
  if(arrow==="none")return;
  const dx=gr.x2-gr.x1,dy=gr.y2-gr.y1,l=Math.hypot(dx,dy)||1,ux=dx/l,uy=dy/l,ah=10;
  const heads=arrow==="single"?[[gr.x2,gr.y2,-1]]:[[gr.x1,gr.y1,1],[gr.x2,gr.y2,-1]];
  heads.forEach(([x,y,s])=>{
    svgEl("path",{d:`M${x+s*ux*ah- uy*ah*.5} ${y+s*uy*ah+ux*ah*.5}L${x} ${y}L${x+s*ux*ah+uy*ah*.5} ${y+s*uy*ah-ux*ah*.5}`,fill:"none",stroke,"stroke-width":sw},g);
  });
}
function perimeterLength(pc){let L=0;for(let i=0;i<pc.points.length;i++)L+=segLen(pc,i);return L;}
function grainAngle(gr){if(!gr)return 0;let a=deg(Math.atan2(-(gr.y2-gr.y1),gr.x2-gr.x1));return (a%360+360)%360;} // screen y-down → math angle
function renderDesign(svg){
  const p=activePattern();const px=pxScale();
  const g=svgEl("g",{},svg);
  if(p)for(const pc of p.pieces){
    normPieceStyles(pc);
    const st=pc.styles;
    const poly=samplePiece(pc);if(poly.length<3)continue;
    const isSel=pc.id===S.sel.piece;
    const labels=[];  // {x,y,text,size,color} collected, drawn last
    /* seam line (offset). is_cut aside, this is the seam-allowance boundary */
    if(S.view.seam&&pc.seam>0){
      const off=offsetPolygon(poly,pc.seam);
      svgEl("path",{d:pathD(off),fill:"rgba(0,0,0,0.02)",stroke:st.seam.color,"stroke-width":st.seam.thickness*px,
        "stroke-dasharray":dashFor(st.seam.style,px)},g);
      if(st.seam.label.visible){const b=polyBBox(off);labels.push({x:b.x2,y:b.y1,text:st.seam.label.text||`${fmtU(pc.seam)} seam`,size:st.seam.label.fontSize,color:st.seam.color,anchor:"start"});}
    }
    if(pc.sewLine&&pc.sewLine.length>2&&S.view.seam)svgEl("path",{d:pathD(pc.sewLine),fill:"none",stroke:st.seam.color,"stroke-width":st.seam.thickness*px,"stroke-dasharray":dashFor("dotted",px),opacity:.7},g);
    /* perimeter (drafted / sew line) */
    svgEl("path",{d:pathD(poly),fill:isSel?"rgba(61,155,255,0.06)":"rgba(0,0,0,0.012)",
      stroke:isSel?"#3d9bff":st.perimeter.color,"stroke-width":(isSel?1.8:st.perimeter.thickness)*px,
      "stroke-dasharray":dashFor(st.perimeter.style,px),"data-piece":pc.id},g);
    if(st.perimeter.label.visible){const b=polyBBox(poly);labels.push({x:(b.x1+b.x2)/2,y:b.y1-6*px,text:st.perimeter.label.text||pc.name,size:st.perimeter.label.fontSize,color:st.perimeter.color,anchor:"middle"});}
    /* notches */
    for(const nt of pc.notches)drawNotch(g,pc,nt,"#c02020",1.4*px);
    /* internal lines */
    for(const il of (pc.internals||[]))
      svgEl("line",{x1:il.x1,y1:il.y1,x2:il.x2,y2:il.y2,stroke:st.internal.color,
        "stroke-width":st.internal.thickness*px,"stroke-dasharray":dashFor(st.internal.style,px)},g);
    if(st.internal.label.visible&&(pc.internals||[]).length){const il=pc.internals[0];
      labels.push({x:(il.x1+il.x2)/2,y:(il.y1+il.y2)/2,text:st.internal.label.text||"internal",size:st.internal.label.fontSize,color:st.internal.color,anchor:"middle"});}
    /* symmetry axis */
    if(pc.sym&&(isSel||pc.sym.enabled)){
      svgEl("line",{x1:pc.sym.x1,y1:pc.sym.y1,x2:pc.sym.x2,y2:pc.sym.y2,
        stroke:pc.sym.enabled?"#c136c1":"#bbb","stroke-width":1.1*px,
        "stroke-dasharray":`${10*px} ${3*px} ${2*px} ${3*px}`},g);
      if(pc.sym.enabled&&isSel)
        svgEl("text",{x:pc.sym.x2+5*px,y:pc.sym.y2,"font-size":8.5*px*1.4,fill:"#c136c1","font-family":"ui-monospace,Consolas,monospace"},g).textContent="⇋ sym";
    }
    /* grain */
    if(pc.grain){
      drawGrain(g,pc.grain,st.grain.color,st.grain.thickness*px,st.grain.arrow);
      if(st.grain.label.visible)labels.push({x:(pc.grain.x1+pc.grain.x2)/2,y:(pc.grain.y1+pc.grain.y2)/2-5*px,text:st.grain.label.text||"Straight Grain",size:st.grain.label.fontSize,color:st.grain.color,anchor:"middle"});
    }
    /* piece name (always, faint) */
    const c=polyCentroid(poly);
    svgEl("text",{x:c.x,y:c.y,"text-anchor":"middle","font-size":Math.min(14*px*1.6,polyBBox(poly).h*.12),fill:"#777","font-family":"ui-monospace,Consolas,monospace"},g).textContent=pc.name;
    /* print-visible line labels */
    for(const lb of labels)

  }

function shrinkScale(){const M=S.marker;return M?{x:1/Math.max(.01,1-M.shrinkX/100),y:1/Math.max(.01,1-M.shrinkY/100)}:{x:1,y:1};}
function placementPoly(pl,withBuffer){
  const M=S.marker,pc=M.pattern.pieces.find(x=>x.id===pl.pieceId);if(!pc)return[];
  let poly=samplePiece(pc);
  if(pc.seam>0)poly=offsetPolygon(poly,pc.seam);       // cutting line is what occupies fabric
  if(withBuffer&&pc.buffer>0)poly=offsetPolygon(poly,pc.buffer);
  const sc=shrinkScale();
  poly=poly.map(p=>({x:p.x*sc.x,y:p.y*sc.y}));
  return transformPoly(poly,pl);
}
function markerLength(){
  const M=S.marker;if(!M||!M.placements.length)return 0;
  let mx=0;for(const pl of M.placements){const b=polyBBox(placementPoly(pl,false));if(b.x2>mx)mx=b.x2;}
  return Math.max(0,mx);
}
function markerUtilization(){
  const M=S.marker;if(!M)return 0;const L=markerLength();if(L<=0)return 0;
  let area=0;for(const pl of M.placements)area+=Math.abs(polyArea(placementPoly(pl,false)));
  return 100*area/(L*M.fabricWidth);
}
function placementValid(idx,plOverride){
  const M=S.marker;const pl=plOverride||M.placements[idx];
  const poly=placementPoly(pl,false),buf=placementPoly(pl,true);
  const bb=polyBBox(poly);
  if(bb.y1<-0.01||bb.y2>M.fabricWidth+0.01||bb.x1<-0.01)return false;   // inside fabric band
  for(let j=0;j<M.placements.length;j++){
    if(j===idx)continue;
    if(polysOverlap(buf,placementPoly(M.placements[j],false)))return false;
    if(polysOverlap(poly,placementPoly(M.placements[j],true)))return false;
  }
  return true;
}
function tryPlacementEdit(idx,changes){
  const M=S.marker;const pl=Object.assign({},M.placements[idx],changes);
  if(placementValid(idx,pl)){Object.assign(M.placements[idx],changes);return true;}
  toast("Blocked: overlap / outside fabric");return false;
}
const PAGE_SIZES={a4:{w:210,h:297,label:"A4"},letter:{w:215.9,h:279.4,label:"US Letter"},a0:{w:841,h:1189,label:"A0"}};
const PAGE_MARGIN=10, GLUE_OVERLAP=10;
function tileGeometry(){ // usable tile step for current paged mode
  const pg=PAGE_SIZES[S.markerMode];if(!pg)return null;
  const uw=pg.w-2*PAGE_MARGIN, uh=pg.h-2*PAGE_MARGIN;
  return {pg,uw,uh,stepX:uw-GLUE_OVERLAP,stepY:uh-GLUE_OVERLAP};
}
function renderMarker(svg){

      stroke:invalid?"#e03030":sel?"#3d9bff":"#1a1a1a","stroke-width":(sel?1.8:1.2)*px,"data-pl":i},g);

  });
}

/* give point i a smooth handle whose direction follows its neighbours (Catmull-Rom tangent) */

  const near=Math.min(l/3, 60);
  setSmoothHandle(pts[i],pts[i].x+tx/l*near, pts[i].y+ty/l*near);

/* --- rectangle / circle commit --- */
function commitShape(d){
  const p=activePattern();if(!p)return;
  let x1=Math.min(d.start.x,d.cur.x),y1=Math.min(d.start.y,d.cur.y),
      x2=Math.max(d.start.x,d.cur.x),y2=Math.max(d.start.y,d.cur.y);
  let w=x2-x1,h=y2-y1;
  if(d.square){const s2=Math.max(w,h);w=s2;h=s2;x2=x1+w;y2=y1+h;}
  if(w<3||h<3){render();return;}                       // ignore tiny drags
  const kind=S.shapeKind;
  const names={rect:"Rectangle",ellipse:"Ellipse",roundrect:"Rounded rect"};
  const pc=newPiece((names[kind]||"Shape")+" "+(p.pieces.length+1));
  if(kind==="rect"){
    pc.points=[newPoint(x1,y1),newPoint(x2,y1),newPoint(x2,y2),newPoint(x1,y2)];
  }else if(kind==="ellipse"){                           // ellipse via 4 smooth bézier anchors (kappa)
    const cx=(x1+x2)/2,cy=(y1+y2)/2,rx=w/2,ry=h/2,K=0.5522847498;
    const A=[[cx+rx,cy],[cx,cy+ry],[cx-rx,cy],[cx,cy-ry]];   // right, bottom, left, top
    const T=[[0,K],[-K,0],[0,-K],[K,0]];                     // unit tangent dir at each (CCW screen)
    pc.points=A.map((pt,i)=>{const np=newPoint(pt[0],pt[1],true);
      np.hOut={x:pt[0]+T[i][0]*rx,y:pt[1]+T[i][1]*ry};
      np.hIn ={x:pt[0]-T[i][0]*rx,y:pt[1]-T[i][1]*ry};return np;});
  }else{                                                 // rounded rectangle
    const r=Math.max(0,Math.min(S.cornerR,w/2,h/2));
    pc.points=roundRectPoints(x1,y1,x2,y2,r);
  }
  const bb=polyBBox(samplePiece(pc));
  pc.grain={x1:bb.x1+bb.w*.25,y1:(bb.y1+bb.y2)/2,x2:bb.x1+bb.w*.75,y2:(bb.y1+bb.y2)/2};
  p.pieces.push(pc);S.sel.piece=pc.id;S.sel.point=null;render();
  toast(`${names[kind]} ${fmt(w)} × ${fmt(h)} ${S.units}`);
}
/* rounded rectangle: 8 anchors (2 per corner) with bézier handles forming quarter-circle arcs */
function roundRectPoints(x1,y1,x2,y2,r){
  const K=0.5522847498*r;
  const P=(x,y,hInx,hIny,hOutx,hOuty)=>{const np=newPoint(x,y,true);
    np.hIn=(hInx==null)?null:{x:x+hInx,y:y+hIny};
    np.hOut=(hOutx==null)?null:{x:x+hOutx,y:y+hOuty};return np;};

    P(x1+r,y1, null,null, 0,0),      // TL arc end (top edge start) — corner, straight to next
    P(x2-r,y1, 0,0, K,0),            // TR arc start
    P(x2,y1+r, 0,-K, 0,0),           // TR arc end
    P(x2,y2-r, 0,0, 0,K),            // BR arc start
    P(x2-r,y2, K,0, 0,0),            // BR arc end
    P(x1+r,y2, 0,0, -K,0),           // BL arc start
    P(x1,y2-r, 0,K, 0,0),            // BL arc end
    P(x1,y1+r, 0,0, 0,-K),           // TL arc start

function commitPieceMirror(w){

  const symmetric=pc.points.every(pt=>{
    if(distToAxis(pt,ax)<TOL)return true;
    const r=reflectPoint(pt,ax);

  });

    pc.sym={x1:ax.x1,y1:ax.y1,x2:ax.x2,y2:ax.y2,enabled:true};

  }

  const n=pc.points.length;
  const onAxis=pc.points.map((pt,i)=>distToAxis(pt,ax)<TOL?i:-1).filter(i=>i>=0);
  if(!onAxis.length){toast("Unfold needs the fold edge on the axis — click along the piece's straight fold side");return;}

/* Insert a new anchor on segment `seg` at parameter t (0..1). Returns the new index.
   If curve=true the new anchor is a handle-free curve point (Curvature tool). Notches on
   the split segment are remapped, and under symmetric edit a mirrored twin is inserted. */
function insertPointOnEdge(pc,seg,t,curve){
  const q=pointOnSegment(pc,seg,t);
  const np=newPoint(q.x,q.y,!!curve);
  pc.points.splice(seg+1,0,np);
  /* remap notches: those on the split segment divide by t; later segments shift by +1 */
  (pc.notches||[]).forEach(nt=>{
    if(nt.seg>seg)nt.seg+=1;
    else if(nt.seg===seg){
      if(nt.t<=t){nt.t=nt.t/(t||1e-6);}          // stays on first half (seg)
      else{nt.seg=seg+1;nt.t=(nt.t-t)/((1-t)||1e-6);} // moves to new second half
    }

  if(pc.sym&&pc.sym.enabled){
    const r=reflectPoint(np,pc.sym);

/* delete an anchor (keeps ≥3), remapping notches and removing its symmetric twin */
function deletePoint(pc,idx){

function arcsBetween(pc,a,b){
  const n=pc.points.length,fwd=[],bwd=[];

  for(let i=(a-1+n)%n;i!==b;i=(i-1+n)%n)bwd.push(i);

/* commit smooth: replace the run [start..end] with start(corner)+kept(curve)+end(corner) */
function commitSmooth(){
  const o=S.op;if(!o||o.kind!=="smooth"||o.startIdx==null||o.endIdx==null)return;
  const pc=o.piece,run=o.run;
  const keepSet=o.keep;
  // build new interior points: kept intermediates become handle-free curve points
  const keptIdx=run.filter(i=>keepSet.has(i));
  const interior=keptIdx.map(i=>{const s=pc.points[i];const np=newPoint(s.x,s.y,true);np.grade=s.grade||{};return np;});
  pc.points[o.startIdx].curve=false;pc.points[o.startIdx].hIn=null;pc.points[o.startIdx].hOut=null;
  pc.points[o.endIdx].curve=false;pc.points[o.endIdx].hIn=null;pc.points[o.endIdx].hOut=null;
  // splice: remove all run indices, insert interior after start. Work on a rebuilt array to keep it simple.

  let i=o.startIdx;newPts.push(startPt);

  const dir=(run.length&&run[0]===((o.startIdx+1)%n))?1:-1;

  let j=( (o.endIdx+dir)%n+n)%n;

  pc.notches=[];                                // segment indices changed; clear (re-add if needed)
  S.op=null;setTool("select");S.sel.piece=pc.id;S.sel.point=null;render();
  toast(`Smoothed — ${interior.length} point${interior.length===1?"":"s"} kept`);
}
function closeDraft(){commitInternal(false);}   // Enter / double-click → open Internal Line
function commitInternal(closed){
  const p=activePattern();
  if(!S.draft){return;}
  const pts=S.draft.points;
  while(pts.length>1){                                   // drop phantom points (double-click, click-on-start)
    const a=pts[pts.length-1],b=pts[pts.length-2];
    if(Math.hypot(a.x-b.x,a.y-b.y)<6*pxScale())pts.pop(); else break;
  }
  const min=closed?3:2;
  if(pts.length<min){toast(closed?"A polygon needs at least 3 points":"A line needs at least 2 points");return;}
  const host=S.draft.host||hostPieceForLine(pts);
  if(!host){toast("Pen draws internal lines — make a piece first (Rectangle / Ellipse), then draw on it");S.draft=null;render();return;}
  const sampled=closed?samplePiece({points:pts}):sampleOpen(pts);   // closed loop vs open path
  const n=sampled.length;const segs=closed?n:n-1;
  host.internals=host.internals||[];const before=host.internals.length;
  for(let i=0;i<segs;i++){const a=sampled[i],b=sampled[(i+1)%n];host.internals.push({x1:a.x,y1:a.y,x2:b.x,y2:b.y});}
  S.sel.piece=host.id;S.sel.point=null;S.draft=null;penLast=null;setTool("select");render();

/* choose the piece an internal line belongs to: the one containing the first point,

function hostPieceForLine(pts){
  const p=activePattern();if(!p||!p.pieces.length)return null;
  for(let i=p.pieces.length-1;i>=0;i--)
    if(pointInPoly(pts[0],samplePiece(p.pieces[i])))return p.pieces[i];
  let host=null,bd=1e9;
  for(const pc of p.pieces){const poly=samplePiece(pc);
    for(const q of pts)for(const bp of poly){const d=Math.hypot(bp.x-q.x,bp.y-q.y);if(d<bd){bd=d;host=pc;}}}
  return host;
}
/* snap a world point to the nearest pattern boundary within tolerance (px). Returns

function snapToBoundary(w,onlyPiece){
  const p=activePattern();if(!p)return null;
  const tol=10*pxScale();let best=null,bd=tol;

function loadPatternIntoMarker(){
  const p=activePattern();
  if(!p||!p.pieces.length)return toast("No pattern with pieces to load");
  const doLoad=()=>{
    S.marker={type:"wmrk",version:1,pattern:clone(p),fabricWidth:1500,shrinkX:0,shrinkY:0,placements:[],mode:S.markerMode};
    buildInstances();autoArrange();
    S.workspace="marker";S.sel.placement=null;
    fitView("marker");render();
    toast(`Loaded ${p.name} — ${p.size} (${S.marker.placements.length} pieces)`);
  };
  if(S.marker)confirmDialog(`Marker already holds "${S.marker.pattern.name} — ${S.marker.pattern.size}". Replace it? (One pattern per marker — no multi-size nesting in v1.)`,doLoad,"Replace");
  else doLoad();
}
function buildInstances(){
  const M=S.marker;M.placements=[];
  for(const pc of M.pattern.pieces){
    const variants=[{mx:false,my:false}];
    if(pc.oppositeX)variants.push(...variants.map(v=>({mx:true,my:v.my})));
    if(pc.oppositeY)variants.push(...variants.map(v=>({mx:v.mx,my:true})));
    for(const v of variants)for(let q=0;q<pc.qty;q++)
      M.placements.push({pieceId:pc.id,x:0,y:0,rot:0,mx:v.mx,my:v.my});
  }
}
function autoArrange(){ // simple shelf packer inside fabric width
  const M=S.marker;if(!M)return;
  const gap=5;
  const items=M.placements.map((pl,i)=>{
    const raw=placementPoly(Object.assign({},pl,{x:0,y:0,rot:0}),true);
    return {i,bb:polyBBox(raw)};
  }).sort((a,b)=>b.bb.h-a.bb.h);
  /* shelf packing: columns advance along fabric length (x), pieces stack across width (y) */
  let x=gap,y=gap,colW=0,tooTall=false;
  for(const it of items){
    const pl=M.placements[it.i];pl.rot=0;
    if(it.bb.h>M.fabricWidth-2*gap)tooTall=true;
    if(y>gap&&y+it.bb.h>M.fabricWidth-gap){y=gap;x+=colW+gap;colW=0;} // new column
    pl.x=x-it.bb.x1;pl.y=y-it.bb.y1;
    y+=it.bb.h+gap;colW=Math.max(colW,it.bb.w);
  }
  if(tooTall)toast("Warning: a piece is taller than the fabric width");
}
function rotateSelected(){
  const M=S.marker;if(!M||S.sel.placement==null)return;
  const pl=M.placements[S.sel.placement];
  const pc=M.pattern.pieces.find(x=>x.id===pl.pieceId);
  if(!pc||!pc.rotationAllow)return toast("Rotation not allowed on this piece");
  if(tryPlacementEdit(S.sel.placement,{rot:((pl.rot||0)+90)%360}))render();
}

          j.poms=j.poms||[];j.targets=j.targets||{};
          S.patterns.push(j);S.activePatternId=j.id;S.workspace="design";
          S.fileName.design=f.name;S.sel={piece:null,point:null,placement:null};
          fitView("design");render();toast(`Opened pattern ${j.name} — ${j.size}`);
        }else if(j.type==="wmrk"||j.placements){ // route → Marker Making
          const applyMarker=()=>{S.marker=j;S.markerMode=j.mode||"marker";S.workspace="marker";
            S.fileName.marker=f.name;S.sel.placement=null;
            fitView("marker");render();toast(`Opened marker (${j.pattern.name} — ${j.pattern.size})`);};
          if(S.marker)confirmDialog("Replace the pattern currently in the marker?",applyMarker,"Replace");
          else applyMarker();
        }else toast("Unrecognised file structure");
      }catch(err){toast("Could not parse file: "+err.message);}
    };
    rd.readAsText(f);
  };
  fi.click();
}

/* =========================================================
   DXF EXPORT (4.2) — AAMA-292 / ASTM D6673 layer conventions
   layers: 1 boundary(cut) · 2 turn pts · 3 curve pts · 4 notches ·
           7 grain · 13 drills · 15 annotation · sew line 14 (AAMA) / 84 (ASTM)
   ========================================================= */
function dxfHeader(flavor){
  return ["999",`ProwdCAD 1.0 — ${flavor.toUpperCase()} export — units mm — 1:1`,
    "0","SECTION","2","HEADER","9","$INSUNITS","70","4","9","$MEASUREMENT","70","1","0","ENDSEC",
    "0","SECTION","2","ENTITIES"];
}
function aci(hex){ // nearest AutoCAD Color Index for common line-type colors
  const map={"#000000":7,"#ffffff":7,"#ff0000":1,"#ffff00":2,"#00ff00":3,"#00ffff":4,"#0000ff":5,"#ff00ff":6,"#008000":3,"#ffa500":30};
  const h=(hex||"").toLowerCase();if(map[h]!=null)return map[h];
  const r=parseInt(h.slice(1,3),16)||0,g=parseInt(h.slice(3,5),16)||0,b=parseInt(h.slice(5,7),16)||0;
  const cand=[[1,255,0,0],[2,255,255,0],[3,0,255,0],[4,0,255,255],[5,0,0,255],[6,255,0,255],[7,255,255,255],[7,0,0,0],[30,255,165,0]];
  let best=7,bd=1e9;for(const[i,cr,cg,cb]of cand){const d=(r-cr)**2+(g-cg)**2+(b-cb)**2;if(d<bd){bd=d;best=i;}}return best;
}
function dxfPolyline(lines,poly,layer,closed=true,color){
  lines.push("0","POLYLINE","8",layer);if(color!=null)lines.push("62",String(color));lines.push("66","1","70",closed?"1":"0");
  for(const p of poly)lines.push("0","VERTEX","8",layer,"10",p.x.toFixed(3),"20",(-p.y).toFixed(3),"30","0");
  lines.push("0","SEQEND");
}
function dxfLine(lines,x1,y1,x2,y2,layer,color){lines.push("0","LINE","8",layer);if(color!=null)lines.push("62",String(color));lines.push("10",x1.toFixed(3),"20",(-y1).toFixed(3),"11",x2.toFixed(3),"21",(-y2).toFixed(3));}
function dxfPoint(lines,x,y,layer){lines.push("0","POINT","8",layer,"10",x.toFixed(3),"20",(-y).toFixed(3));}
function dxfText(lines,x,y,h,txt,layer){lines.push("0","TEXT","8",layer,"10",x.toFixed(3),"20",(-y).toFixed(3),"40",h.toFixed(2),"1",txt);}
function exportDXF(flavor,fname){ // pattern design workspace
  const p=activePattern();if(!p||!p.pieces.length)return toast("No pattern to export");
  const L=dxfHeader(flavor);
  const sewLayer=flavor==="astm"?"84":"14";
  for(const pc of p.pieces){
    normPieceStyles(pc);const st=pc.styles;
    const poly=samplePiece(pc);if(poly.length<3)continue;
    const cut=pc.seam>0?offsetPolygon(poly,pc.seam):poly;
    dxfPolyline(L,cut,"1",true,aci(st.perimeter.color));         // piece boundary (cut)
    if(flavor!=="dxf"&&pc.seam>0)dxfPolyline(L,poly,sewLayer,true,aci(st.seam.color));  // sew line
    if(flavor!=="dxf"){
      pc.points.forEach(pt=>dxfPoint(L,pt.x,pt.y,pt.curve?"3":"2"));
    }
    pc.notches.forEach(nt=>{const q=pointOnSegment(pc,nt.seg,nt.t);dxfPoint(L,q.x,q.y,"4");});
    (pc.internals||[]).forEach(il=>dxfLine(L,il.x1,il.y1,il.x2,il.y2,"8",aci(st.internal.color)));
    if(pc.grain)dxfLine(L,pc.grain.x1,pc.grain.y1,pc.grain.x2,pc.grain.y2,"7",aci(st.grain.color));
    const c=polyCentroid(poly);
    dxfText(L,c.x,c.y,20,`${pc.name} / ${p.name} / size ${p.size} / qty ${pc.qty}`,"15");
  }
  L.push("0","ENDSEC","0","EOF");
  download(fname||`${p.name}-${p.size}-${flavor}.dxf`.replace(/\s+/g,"_"),L.join("\r\n"),"application/dxf");
  toast(`Exported ${flavor.toUpperCase()} DXF (1:1, mm)`);
}
function exportPlotDXF(fname){ // marker mode: full layout at 1:1 on fabric width
  const M=S.marker;if(!M||!M.placements.length)return toast("Marker is empty");
  const L=dxfHeader("plot");
  dxfLine(L,0,0,markerLength(),0,"6");                       // selvedges on layer 6
  dxfLine(L,0,M.fabricWidth,markerLength(),M.fabricWidth,"6");
  M.placements.forEach(pl=>{
    const pc=M.pattern.pieces.find(x=>x.id===pl.pieceId);
    dxfPolyline(L,placementPoly(pl,false),"1");
    if(pc){
      const sc=shrinkScale();
      pc.notches.forEach(nt=>{
        const q=pointOnSegment(pc,nt.seg,nt.t);
        const t=transformPoly([{x:q.x*sc.x,y:q.y*sc.y}],pl)[0];
        dxfPoint(L,t.x,t.y,"4");
      });
      (pc.internals||[]).forEach(il=>{
        const [a,b]=transformPoly([{x:il.x1*sc.x,y:il.y1*sc.y},{x:il.x2*sc.x,y:il.y2*sc.y}],pl);
        dxfLine(L,a.x,a.y,b.x,b.y,"8");
      });
      const c=polyCentroid(placementPoly(pl,false));
      dxfText(L,c.x,c.y,15,pc.name,"15");
    }
  });
  L.push("0","ENDSEC","0","EOF");
  download(fname||`${M.pattern.name}-${M.pattern.size}-marker-plot.dxf`.replace(/\s+/g,"_"),L.join("\r\n"),"application/dxf");
  toast("Exported Plot DXF (1:1 marker layout)");
}

/* =========================================================
   DXF IMPORT (4.1) — tolerant parser + import report
   ========================================================= */
function parseDXFEntities(txt){
  const raw=txt.split(/\r\n|\r|\n/);const pairs=[];
  for(let i=0;i+1<raw.length;i+=2)pairs.push([raw[i].trim(),raw[i+1]]);
  const ents=[];let i=0;
  const isEnt=v=>["LINE","LWPOLYLINE","POLYLINE","VERTEX","SEQEND","POINT","TEXT","MTEXT","SPLINE","ARC","CIRCLE","INSERT"].includes(v);
  while(i<pairs.length){
    const [c,v]=pairs[i];
    if(c==="0"&&isEnt(v.trim())){
      const e={etype:v.trim(),layer:"0",pts:[],x:0,y:0,x2:0,y2:0,text:"",closed:false};
      i++;let cx=null;
      while(i<pairs.length&&pairs[i][0]!=="0"){
        const [g,val]=pairs[i];const f=parseFloat(val);
        if(g==="8")e.layer=val.trim();
        else if(g==="70")e.closed=((parseInt(val)||0)&1)===1;
        else if(g==="10"){if(e.etype==="LWPOLYLINE"){cx=f;}else e.x=f;}
        else if(g==="20"){if(e.etype==="LWPOLYLINE"&&cx!=null){e.pts.push({x:cx,y:-f});cx=null;}else e.y=-f;}
        else if(g==="11")e.x2=f;else if(g==="21")e.y2=-f;
        else if(g==="1")e.text=val;
        i++;
      }
      ents.push(e);
    }else i++;
  }
  /* stitch POLYLINE + VERTEX… + SEQEND */
  const out=[];
  for(let k=0;k<ents.length;k++){
    const e=ents[k];
    if(e.etype==="POLYLINE"){
      const pl={etype:"POLY",layer:e.layer,pts:[],closed:e.closed};
      k++;
      while(k<ents.length&&ents[k].etype==="VERTEX"){pl.pts.push({x:ents[k].x,y:ents[k].y});k++;}
      if(k<ents.length&&ents[k].etype!=="SEQEND")k--;
      out.push(pl);
    }else if(e.etype==="LWPOLYLINE"){out.push({etype:"POLY",layer:e.layer,pts:e.pts,closed:e.closed});}
    else if(e.etype!=="VERTEX"&&e.etype!=="SEQEND")out.push(e);
  }
  return out;
}
const LAYER_MAP={ "1":"boundary","2":"turn","3":"curvept","4":"notch","5":"grade-ref","6":"mirror","7":"grain",
  "8":"internal","13":"drill","14":"sew","15":"annotation","80":"boundary","84":"sew","85":"annotation" };
function importDXF(txt,fname){
  let ents;try{ents=parseDXFEntities(txt);}catch(err){return toast("DXF parse failed: "+err.message);}
  const report={pieces:0,notches:0,grains:0,texts:0,internals:0,skippedSew:0,unknownLayers:{},unsupported:{}};
  const pat=newPattern(fname.replace(/\.dxf$/i,""),"import");
  const boundaries=[],notchPts=[],grainLines=[],texts=[],curvePts=[],internalEnts=[];
  for(const e of ents){
    const role=LAYER_MAP[e.layer];
    if(!role){report.unknownLayers[e.layer]=(report.unknownLayers[e.layer]||0)+1;continue;}
    if(e.etype==="POLY"&&role==="boundary")boundaries.push(e);
    else if(e.etype==="POLY"&&role==="sew")report.skippedSew++;
    else if(role==="internal"&&(e.etype==="LINE"||e.etype==="POLY"))internalEnts.push(e);
    else if((e.etype==="POINT")&&(role==="notch"))notchPts.push(e);
    else if((e.etype==="POINT")&&(role==="curvept"))curvePts.push(e);
    else if(e.etype==="LINE"&&role==="grain")grainLines.push(e);
    else if((e.etype==="TEXT"||e.etype==="MTEXT")&&role==="annotation")texts.push(e);
    else if(e.etype==="SPLINE"||e.etype==="ARC"||e.etype==="CIRCLE"||e.etype==="INSERT")
      report.unsupported[e.etype]=(report.unsupported[e.etype]||0)+1;
  }
  /* normalise coordinates: shift so min corner is (0,0)+margin */
  const allpts=boundaries.flatMap(b=>b.pts);
  if(!boundaries.length)  {showImportReport(report,fname,null);return;}
  const bb=polyBBox(allpts);
  const shift=p=>({x:p.x-bb.x1,y:p.y-bb.y1});
  boundaries.forEach((b,bi)=>{
    const pc=newPiece("Imported "+(bi+1));
    pc.seam=0;
    pc.points=b.pts.map(pt=>{const s=shift(pt);
      const isCurve=curvePts.some(cp=>Math.hypot(cp.x-pt.x,cp.y-pt.y)<0.5);
      return newPoint(s.x,s.y,isCurve);});
    if(pc.points.length>=3){
      /* drop duplicate closing point */
      const f=pc.points[0],l=pc.points[pc.points.length-1];
      if(Math.hypot(f.x-l.x,f.y-l.y)<0.01)pc.points.pop();
      pat.pieces.push(pc);report.pieces++;
    }
  });
  /* attach grain lines & notches to containing pieces */
  for(const gl of grainLines){
    const a=shift({x:gl.x,y:gl.y}),b2=shift({x:gl.x2,y:gl.y2});
    const mid={x:(a.x+b2.x)/2,y:(a.y+b2.y)/2};
    const pc=pat.pieces.find(pp=>pointInPoly(mid,samplePiece(pp)));
    if(pc){pc.grain={x1:a.x,y1:a.y,x2:b2.x,y2:b2.y};report.grains++;}
  }
  for(const ie of internalEnts){
    const segs=ie.etype==="LINE"
      ? [[{x:ie.x,y:ie.y},{x:ie.x2,y:ie.y2}]]
      : ie.pts.slice(0,-1).map((q,i)=>[q,ie.pts[i+1]]);
    for(const [a0,b0] of segs){
      const a=shift(a0),b2=shift(b0),mid={x:(a.x+b2.x)/2,y:(a.y+b2.y)/2};
      const pc=pat.pieces.find(pp=>pointInPoly(mid,samplePiece(pp)));
      if(pc){pc.internals.push({x1:a.x,y1:a.y,x2:b2.x,y2:b2.y});report.internals++;}
    }
  }
  for(const np of notchPts){
    const q=shift({x:np.x,y:np.y});let best=null,bd=25;
    for(const pc of pat.pieces)for(let seg=0;seg<pc.points.length;seg++)for(let s=0;s<=SEG_STEPS;s++){
      const t=s/SEG_STEPS,pt=pointOnSegment(pc,seg,t);const d=Math.hypot(pt.x-q.x,pt.y-q.y);
      if(d<bd){bd=d;best={pc,seg,t};}
    }
    if(best){best.pc.notches.push({seg:best.seg,t:best.t});report.notches++;}
  }
  for(const tx of texts){const q=shift({x:tx.x,y:tx.y});
    const pc=pat.pieces.find(pp=>pointInPoly(q,samplePiece(pp)));
    (pc?pc.annotations:pat.pieces[0]?pat.pieces[0].annotations:[]).push(tx.text);report.texts++;}
  S.patterns.push(pat);S.activePatternId=pat.id;S.workspace="design";
  S.sel={piece:null,point:null,placement:null};
  fitView("design");render();
  showImportReport(report,fname,pat);
}
function showImportReport(r,fname,pat){
  const unk=Object.entries(r.unknownLayers),uns=Object.entries(r.unsupported);
  dialog("Import report — "+fname,`
    ${pat?`<p>Imported into new pattern <b>${pat.name}</b>.</p>`:`<p style="color:var(--danger)">No piece boundaries (layer 1/80) found — nothing imported.</p>`}
    <h4>Recognised</h4>
    <p>Piece boundaries: <b>${r.pieces}</b> · Notches: <b>${r.notches}</b> · Grain lines: <b>${r.grains}</b> · Internal lines: <b>${r.internals}</b> · Annotations: <b>${r.texts}</b>${r.skippedSew?` · Sew-line polylines skipped (geometry kept from cut boundary): <b>${r.skippedSew}</b>`:""}</p>
    <h4>Unrecognised layers</h4>
    <p>${unk.length?unk.map(([l,n])=>`<code>${l}</code> ×${n}`).join("  "):"none"}</p>
    ${uns.length?`<h4>Unsupported entities (skipped)</h4><p>${uns.map(([l,n])=>`<code>${l}</code> ×${n}`).join("  ")}</p>`:""}`,
    [{label:"OK",primary:true}]);
}

/* =========================================================
   GENERIC VECTOR IMPORT (HPGL/PLT plotter files, SVG)
   Closed polylines → piece boundaries · open polylines → internal lines
   ========================================================= */
function downsamplePoly(pts,max){
  if(pts.length<=max)return pts;
  const out=[],step=(pts.length-1)/(max-1);
  for(let i=0;i<max;i++)out.push(pts[Math.round(i*step)]);
  return out;
}
function buildPatternFromPolys(name,closed,opens,notes){
  const report={pieces:0,internalSegs:0,skippedTiny:0,notes:notes||[]};
  /* normalise everything to origin */
  const all=[...closed.flat(),...opens.flat()];
  if(!all.length){toast("No drawable geometry found in file");return null;}
  const bb=polyBBox(all);
  const shift=p=>({x:p.x-bb.x1,y:p.y-bb.y1});
  const pat=newPattern(name,"import");
  for(const poly of closed){
    let pts=poly.map(shift);
    const f=pts[0],l=pts[pts.length-1];
    if(Math.hypot(f.x-l.x,f.y-l.y)<0.5)pts=pts.slice(0,-1);      // drop duplicate closing point
    if(pts.length<3||Math.abs(polyArea(pts))<4){report.skippedTiny++;continue;} // <4mm² noise
    pts=downsamplePoly(pts,160);
    const pc=newPiece("Imported "+(pat.pieces.length+1));pc.seam=0;
    pc.points=pts.map(q=>newPoint(q.x,q.y,false));
    const pb=polyBBox(samplePiece(pc));
    pc.grain={x1:pb.x1+pb.w*.25,y1:(pb.y1+pb.y2)/2,x2:pb.x1+pb.w*.75,y2:(pb.y1+pb.y2)/2};
    pat.pieces.push(pc);report.pieces++;
  }
  /* open polylines become internal lines, attached to containing (else nearest) piece */
  for(const line of opens){
    const pts=line.map(shift);if(pts.length<2)continue;
    const mid=pts[Math.floor(pts.length/2)];
    let host=pat.pieces.find(pc=>pointInPoly(mid,samplePiece(pc)));
    if(!host&&pat.pieces.length){
      let bd=1e9;
      for(const pc of pat.pieces){const poly=samplePiece(pc);
        for(const bp of poly){const d=Math.hypot(bp.x-mid.x,bp.y-mid.y);if(d<bd){bd=d;host=pc;}}}
    }
    if(!host)continue;
    for(let i=0;i<pts.length-1;i++){
      host.internals.push({x1:pts[i].x,y1:pts[i].y,x2:pts[i+1].x,y2:pts[i+1].y});report.internalSegs++;
    }
  }
  if(!pat.pieces.length){toast("No closed boundaries found — nothing imported");return null;}
  S.patterns.push(pat);S.activePatternId=pat.id;S.workspace="design";
  S.sel={piece:null,point:null,placement:null};
  fitView("design");render();
  dialog("Import report — "+name,`
    <p>Imported into new pattern <b>${pat.name}</b>.</p>
    <h4>Recognised</h4>
    <p>Piece boundaries: <b>${report.pieces}</b> · Internal line segments: <b>${report.internalSegs}</b>${report.skippedTiny?` · Tiny/noise paths skipped: <b>${report.skippedTiny}</b>`:""}</p>
    ${report.notes.length?`<h4>Notes</h4><p>${report.notes.map(n=>`• ${n}`).join("<br>")}</p>`:""}`,
    [{label:"OK",primary:true}]);
  return pat;
}

/* ---- HPGL / PLT (plotter output from Gerber, Lectra, Optitex …) ----
   Understands IN, PA/PR, PU/PD with coordinate pairs. 40 plotter units = 1 mm.
   HPGL y-axis points up → flipped on import. */
function parseHPGL(txt){
  const paths=[];let cur={x:0,y:0},pen=false,rel=false,path=null,notes=new Set();
  const cmds=txt.replace(/\x03/g,";").split(/[;\n\r]+/);
  for(let raw of cmds){
    raw=raw.trim();if(!raw)continue;
    const m=raw.match(/^([A-Za-z]{2})\s*(.*)$/);if(!m)continue;
    const cmd=m[1].toUpperCase();
    const nums=(m[2].match(/-?\d*\.?\d+/g)||[]).map(Number);
    const pairs=[];for(let i=0;i+1<nums.length;i+=2)pairs.push({x:nums[i],y:nums[i+1]});
    const apply=p=>rel?{x:cur.x+p.x,y:cur.y+p.y}:p;
    switch(cmd){
      case "PA":rel=false;if(pairs.length)pairs.forEach(p=>{cur=apply(p);if(pen&&path)path.push({...cur});});break;
      case "PR":rel=true; if(pairs.length)pairs.forEach(p=>{cur=apply(p);if(pen&&path)path.push({...cur});});break;
      case "PU":pen=false;if(path&&path.length>1)paths.push(path);path=null;
                if(pairs.length){cur=apply(pairs[pairs.length-1]);}break;
      case "PD":if(!pen){pen=true;path=[{...cur}];}
                pairs.forEach(p=>{cur=apply(p);path.push({...cur});});break;
      case "IN":case "IP":case "SP":case "LT":case "PW":case "PT":case "VS":break;
      case "SC":notes.add("SC (user scaling) ignored — assumed 40 units/mm");break;
      case "LB":notes.add("LB text labels skipped");break;
      case "AA":case "AR":case "CI":notes.add(cmd+" arcs approximated by their endpoints");if(pairs.length&&pen&&path){cur=apply(pairs[0]);path.push({...cur});}break;
      default:notes.add(cmd+" ignored");
    }
  }
  if(path&&path.length>1)paths.push(path);
  return {paths,notes:[...notes]};
}
function importHPGL(txt,fname){
  const {paths,notes}=parseHPGL(txt);
  if(!paths.length){toast("No PD/PU pen paths found in "+fname);return;}
  const mm=p=>({x:p.x/40,y:-p.y/40});                      // 40 units/mm, flip y
  const closed=[],opens=[];
  for(const path of paths){
    const pts=path.map(mm);
    const f=pts[0],l=pts[pts.length-1];
    (pts.length>=4&&Math.hypot(f.x-l.x,f.y-l.y)<1?closed:opens).push(pts);
  }
  notes.unshift("HPGL scale: 40 plotter units per mm");
  buildPatternFromPolys(fname.replace(/\.(plt|hpgl|hpg)$/i,""),closed,opens,notes);
}

/* ---- SVG (Illustrator / Inkscape / CAD SVG export) ----
   Own path sampler (M L H V C S Q T Z; A → endpoint line, noted). Assumes 1 SVG unit = 1 mm.
   Element transforms are ignored (noted). */
function sampleSVGPath(d,notes){
  const toks=d.match(/[MmLlHhVvCcSsQqTtZzAa]|-?\d*\.?\d+(?:[eE][-+]?\d+)?/g)||[];
  const subs=[];let pts=null,cur={x:0,y:0},start={x:0,y:0},i=0,cmd="",prevC=null,prevQ=null;
  const num=()=>parseFloat(toks[i++]);
  const push=p=>{cur={x:p.x,y:p.y};pts.push({...cur});};
  const bezSteps=14;
  while(i<toks.length){
    const t=toks[i];
    if(/^[A-Za-z]$/.test(t)){cmd=t;i++;}
    const rel=cmd===cmd.toLowerCase();const C=cmd.toUpperCase();
    const rp=(x,y)=>rel?{x:cur.x+x,y:cur.y+y}:{x,y};
    if(C==="M"){const p=rp(num(),num());if(pts&&pts.length>1)subs.push({pts,closed:false});pts=[{...p}];cur=p;start={...p};cmd=rel?"l":"L";}
    else if(C==="L"){push(rp(num(),num()));prevC=prevQ=null;}
    else if(C==="H"){const x=num();push(rel?{x:cur.x+x,y:cur.y}:{x,y:cur.y});prevC=prevQ=null;}
    else if(C==="V"){const y=num();push(rel?{x:cur.x,y:cur.y+y}:{x:cur.x,y});prevC=prevQ=null;}
    else if(C==="C"||C==="S"){
      let c1;if(C==="C")c1=rp(num(),num());else c1=prevC?{x:2*cur.x-prevC.x,y:2*cur.y-prevC.y}:{...cur};
      const c2=rp(num(),num()),e=rp(num(),num()),p0={...cur};
      for(let s=1;s<=bezSteps;s++){const q=bez(p0,c1,c2,e,s/bezSteps);pts.push({x:q.x,y:q.y});}
      cur={...e};prevC=c2;prevQ=null;
    }
    else if(C==="Q"||C==="T"){
      let c;if(C==="Q")c=rp(num(),num());else c=prevQ?{x:2*cur.x-prevQ.x,y:2*cur.y-prevQ.y}:{...cur};
      const e=rp(num(),num()),p0={...cur};
      const c1={x:p0.x+2/3*(c.x-p0.x),y:p0.y+2/3*(c.y-p0.y)},c2={x:e.x+2/3*(c.x-e.x),y:e.y+2/3*(c.y-e.y)};
      for(let s=1;s<=bezSteps;s++){const q=bez(p0,c1,c2,e,s/bezSteps);pts.push({x:q.x,y:q.y});}
      cur={...e};prevQ=c;prevC=null;
    }
    else if(C==="A"){num();num();num();num();num();const e=rp(num(),num());push(e);notes.add("A (elliptical arc) approximated by a straight line");prevC=prevQ=null;}
    else if(C==="Z"){pts.push({...start});subs.push({pts,closed:true});pts=null;cur={...start};cmd="";}
    else i++;
  }
  if(pts&&pts.length>1)subs.push({pts,closed:false});
  return subs;
}
function importSVG(txt,fname){
  let doc;try{doc=new DOMParser().parseFromString(txt,"image/svg+xml");}catch(e){toast("SVG parse failed");return;}
  if(doc.querySelector("parsererror")){toast("SVG parse error — file may be malformed");return;}
  const notes=new Set(["SVG scale: 1 unit = 1 mm assumed"]);
  if(doc.querySelector("[transform]"))notes.add("element transforms ignored");
  const closed=[],opens=[];
  const nums=s=>(s||"").match(/-?\d*\.?\d+/g)?.map(Number)||[];
  doc.querySelectorAll("path").forEach(el=>{
    for(const sub of sampleSVGPath(el.getAttribute("d")||"",notes))
      (sub.closed?closed:opens).push(sub.pts);
  });
  doc.querySelectorAll("rect").forEach(el=>{
    const x=+el.getAttribute("x")||0,y=+el.getAttribute("y")||0,w=+el.getAttribute("width")||0,h=+el.getAttribute("height")||0;
    if(w>0&&h>0)closed.push([{x,y},{x:x+w,y},{x:x+w,y:y+h},{x,y:y+h}]);
  });
  doc.querySelectorAll("circle,ellipse").forEach(el=>{
    const cx=+el.getAttribute("cx")||0,cy=+el.getAttribute("cy")||0;
    const rx=+(el.getAttribute("rx")||el.getAttribute("r"))||0,ry=+(el.getAttribute("ry")||el.getAttribute("r"))||0;
    if(rx>0&&ry>0){const pts=[];for(let k=0;k<32;k++){const a=k/32*2*Math.PI;pts.push({x:cx+rx*Math.cos(a),y:cy+ry*Math.sin(a)});}closed.push(pts);}
  });
  doc.querySelectorAll("polygon,polyline").forEach(el=>{
    const n=nums(el.getAttribute("points"));const pts=[];for(let k=0;k+1<n.length;k+=2)pts.push({x:n[k],y:n[k+1]});
    if(pts.length>=2)(el.tagName.toLowerCase()==="polygon"?closed:opens).push(pts);
  });
  doc.querySelectorAll("line").forEach(el=>{
    opens.push([{x:+el.getAttribute("x1")||0,y:+el.getAttribute("y1")||0},{x:+el.getAttribute("x2")||0,y:+el.getAttribute("y2")||0}]);
  });
  buildPatternFromPolys(fname.replace(/\.svg$/i,""),closed,opens,[...notes]);
}

/* =========================================================
   PDF EXPORT (4.2) — true scale, registration marks,
   page numbers, 10 mm glue overlap
   ========================================================= */
function jsPDFready(){if(!(window.jspdf&&window.jspdf.jsPDF)){toast("jsPDF not loaded (offline?) — PDF export unavailable");return false;}return true;}
function tiledPDF(drawFn,contentBB,pageKey,fname,headerTxt){
  if(!jsPDFready())return;
  const pg=PAGE_SIZES[pageKey],uw=pg.w-2*PAGE_MARGIN,uh=pg.h-2*PAGE_MARGIN;
  const stepX=uw-GLUE_OVERLAP,stepY=uh-GLUE_OVERLAP;
  const cols=Math.max(1,Math.ceil((contentBB.w-GLUE_OVERLAP)/stepX)),rows=Math.max(1,Math.ceil((contentBB.h-GLUE_OVERLAP)/stepY));
  const doc=new window.jspdf.jsPDF({unit:"mm",format:[pg.w,pg.h],compress:true});
  let n=0,total=rows*cols;
  for(let r=0;r<rows;r++)for(let c=0;c<cols;c++){
    if(n>0)doc.addPage([pg.w,pg.h]);
    n++;
    const ox=contentBB.x1+c*stepX,oy=contentBB.y1+r*stepY; // world mm at printable origin
    /* geometry at 1:1 — page clips overflow automatically */
    drawFn(doc,x=>PAGE_MARGIN+(x-ox),y=>PAGE_MARGIN+(y-oy));
    /* registration crosses at printable-area corners */
    doc.setDrawColor(120);doc.setLineWidth(0.2);
    const corners=[[PAGE_MARGIN,PAGE_MARGIN],[pg.w-PAGE_MARGIN,PAGE_MARGIN],[PAGE_MARGIN,pg.h-PAGE_MARGIN],[pg.w-PAGE_MARGIN,pg.h-PAGE_MARGIN]];
    for(const [cx,cy] of corners){doc.line(cx-4,cy,cx+4,cy);doc.line(cx,cy-4,cx,cy+4);doc.circle(cx,cy,1.5);}
    /* glue overlap guides (right & bottom inner edge) */
    doc.setDrawColor(180);doc.setLineDashPattern([2,2],0);
    if(c<cols-1)doc.line(pg.w-PAGE_MARGIN-GLUE_OVERLAP,PAGE_MARGIN,pg.w-PAGE_MARGIN-GLUE_OVERLAP,pg.h-PAGE_MARGIN);
    if(r<rows-1)doc.line(PAGE_MARGIN,pg.h-PAGE_MARGIN-GLUE_OVERLAP,pg.w-PAGE_MARGIN,pg.h-PAGE_MARGIN-GLUE_OVERLAP);
    doc.setLineDashPattern([],0);
    /* page label */
    doc.setFontSize(8);doc.setTextColor(90);
    doc.text(`${headerTxt} — row ${r+1}, col ${c+1} — page ${n}/${total} — scale 1:1 — glue overlap ${GLUE_OVERLAP} mm`,PAGE_MARGIN,pg.h-PAGE_MARGIN+6);
  }
  doc.save(fname);
  toast(`PDF exported — ${total} ${pg.label} page${total>1?"s":""} at 1:1`);
}
function drawPolyPDF(doc,poly,tx,ty,dashed){
  if(poly.length<3)return;
  if(dashed)doc.setLineDashPattern([3,2],0);
  const pts=poly.map(p=>[tx(p.x),ty(p.y)]);
  for(let i=0;i<pts.length;i++){const a=pts[i],b=pts[(i+1)%pts.length];doc.line(a[0],a[1],b[0],b[1]);}
  if(dashed)doc.setLineDashPattern([],0);
}
function exportPatternPDF(){
  const p=activePattern();if(!p||!p.pieces.length)return toast("No pattern to export");
  const all=[];p.pieces.forEach(pc=>{const poly=samplePiece(pc);all.push(...(pc.seam>0?offsetPolygon(poly,pc.seam):poly));});
  const bb=polyBBox(all);bb.x1-=5;bb.y1-=5;bb.w+=10;bb.h+=10;
  tiledPDF((doc,tx,ty)=>{
    const hex=h=>{h=h.replace("#","");return [parseInt(h.slice(0,2),16),parseInt(h.slice(2,4),16),parseInt(h.slice(4,6),16)];};
    const dash=s=>{const m={dashed:[3,2],dotted:[0.6,1.8],"dash-dot":[3,1.5,0.6,1.5],solid:[]}[s]||[];doc.setLineDashPattern(m,0);};
    for(const pc of p.pieces){
      normPieceStyles(pc);const st=pc.styles;const poly=samplePiece(pc);
      /* seam line */
      if(pc.seam>0){const off=offsetPolygon(poly,pc.seam);doc.setDrawColor(...hex(st.seam.color));doc.setLineWidth(st.seam.thickness*0.35);dash(st.seam.style);drawPolyPDF(doc,off,tx,ty,false);}
      /* perimeter */
      doc.setDrawColor(...hex(st.perimeter.color));doc.setLineWidth(st.perimeter.thickness*0.35);dash(st.perimeter.style);drawPolyPDF(doc,poly,tx,ty,false);
      doc.setLineDashPattern([],0);
      /* notches */
      doc.setDrawColor(0);doc.setLineWidth(0.35);
      for(const nt of pc.notches){const q=pointOnSegment(pc,nt.seg,nt.t),tg=segTangent(pc,nt.seg,nt.t);
        doc.line(tx(q.x-tg.y*8),ty(q.y+tg.x*8),tx(q.x+tg.y*8),ty(q.y-tg.x*8));}
      /* internal lines */
      doc.setDrawColor(...hex(st.internal.color));doc.setLineWidth(st.internal.thickness*0.35);dash(st.internal.style);
      for(const il of (pc.internals||[]))doc.line(tx(il.x1),ty(il.y1),tx(il.x2),ty(il.y2));
      doc.setLineDashPattern([],0);
      /* grain + arrows */
      if(pc.grain){doc.setDrawColor(...hex(st.grain.color));doc.setLineWidth(st.grain.thickness*0.35);
        doc.line(tx(pc.grain.x1),ty(pc.grain.y1),tx(pc.grain.x2),ty(pc.grain.y2));
        if(st.grain.arrow!=="none"){const gx=pc.grain,dx=gx.x2-gx.x1,dy=gx.y2-gx.y1,l=Math.hypot(dx,dy)||1,ux=dx/l,uy=dy/l,ah=8;
          const heads=st.grain.arrow==="single"?[[gx.x2,gx.y2,-1]]:[[gx.x1,gx.y1,1],[gx.x2,gx.y2,-1]];
          heads.forEach(([x,y,s])=>{doc.line(tx(x),ty(y),tx(x+s*ux*ah-uy*ah*.5),ty(y+s*uy*ah+ux*ah*.5));doc.line(tx(x),ty(y),tx(x+s*ux*ah+uy*ah*.5),ty(y+s*uy*ah-ux*ah*.5));});}}
      /* piece name */
      const c=polyCentroid(poly);doc.setDrawColor(0);doc.setFontSize(9);doc.setTextColor(60);
      doc.text(`${pc.name} · ${p.name} ${p.size}`,tx(c.x),ty(c.y),{align:"center"});
      /* print-visible line labels */
      const lab=(cond,x,y,text,size,col)=>{if(!cond||!text)return;doc.setFontSize(size||10);doc.setTextColor(...hex(col));doc.text(text,tx(x),ty(y),{align:"center"});};
      const pb=polyBBox(poly);
      lab(st.perimeter.label.visible,(pb.x1+pb.x2)/2,pb.y1-4,st.perimeter.label.text||pc.name,st.perimeter.label.fontSize,st.perimeter.color);
      if(pc.grain)lab(st.grain.label.visible,(pc.grain.x1+pc.grain.x2)/2,(pc.grain.y1+pc.grain.y2)/2-4,st.grain.label.text,st.grain.label.fontSize,st.grain.color);
      if((pc.internals||[]).length)lab(st.internal.label.visible,(pc.internals[0].x1+pc.internals[0].x2)/2,(pc.internals[0].y1+pc.internals[0].y2)/2,st.internal.label.text,st.internal.label.fontSize,st.internal.color);
      doc.setTextColor(60);
    }
  },bb,"a4",`${p.name}-${p.size}-pattern.pdf`.replace(/\s+/g,"_"),`${p.name} ${p.size}`);
}
function exportMarkerPDF(){
  const M=S.marker;if(!M||!M.placements.length)return toast("Marker is empty");
  if(S.markerMode==="marker")return toast("Switch to A4 Tiles / US Letter / A0 for PDF export");
  const bb={x1:0,y1:0,w:Math.max(markerLength()+10,50),h:M.fabricWidth};
  tiledPDF((doc,tx,ty)=>{
    doc.setDrawColor(120);doc.setLineWidth(0.25);
    doc.line(tx(0),ty(0),tx(bb.w),ty(0));doc.line(tx(0),ty(M.fabricWidth),tx(bb.w),ty(M.fabricWidth));
    doc.setDrawColor(0);doc.setLineWidth(0.4);
    M.placements.forEach(pl=>{
      const poly=placementPoly(pl,false);
      drawPolyPDF(doc,poly,tx,ty,false);
      const pc=M.pattern.pieces.find(x=>x.id===pl.pieceId);
      if(pc){const c=polyCentroid(poly);doc.setFontSize(8);doc.setTextColor(70);doc.text(pc.name,tx(c.x),ty(c.y),{align:"center"});}
    });
  },bb,S.markerMode,`${M.pattern.name}-${M.pattern.size}-marker-${S.markerMode}.pdf`.replace(/\s+/g,"_"),
    `Marker ${M.pattern.name} ${M.pattern.size} · fabric ${fmtU(M.fabricWidth)}`);
}

function loadDemo(){
  const p=newPattern("T-Shirt Block","M");
  const mChest={id:uid(),name:"chest",base:1000};   // circumference, mm
  const mLen={id:uid(),name:"body length",base:700};
  const mSlv={id:uid(),name:"sleeve length",base:220};
  p.measurements=[mChest,mLen,mSlv];
  const gr=(dxC,dyL)=>{const g={};if(dxC)g[mChest.id]={dx:dxC,dy:0};if(dyL)g[mLen.id]={dx:0,dy:dyL};return g;};
  function mkBody(name,neckDrop){
    const pc=newPiece(name);pc.seam=10;pc.buffer=5;pc.qty=1;pc.rotationAllow=false;
    const P=(x,y,c,g)=>{const q=newPoint(x,y,c);if(g)q.grade=g;return q;};
    pc.points=[
      P(120,10,false,gr(-0.05,0)),            // left neck
      P(250,10+neckDrop,true,null),           // centre neck (curve)
      P(380,10,false,gr(0.05,0)),             // right neck
      P(470,55,false,gr(0.15,0)),             // right shoulder tip
      P(462,140,true,gr(0.2,0)),              // right armhole (curve)
      P(500,225,false,gr(0.25,0)),            // right underarm  (chest line)
      P(500,700,false,{[mChest.id]:{dx:0.25,dy:0},[mLen.id]:{dx:0,dy:1}}),  // right hem
      P(0,700,false,{[mLen.id]:{dx:0,dy:1},[mChest.id]:{dx:-0.25,dy:0}}),  // left hem
      P(0,225,false,gr(-0.25,0)),             // left underarm
      P(38,140,true,gr(-0.2,0)),              // left armhole (curve)
      P(30,55,false,gr(-0.15,0)),             // left shoulder tip
    ];
    pc.grain={x1:250,y1:250,x2:250,y2:600};
    pc.notches=[{seg:4,t:0.5},{seg:9,t:0.5}]; // armhole balance notches
    return pc;
  }
  const front=mkBody("Front",60);
  const back=mkBody("Back",22);back.points.forEach(pt=>{pt.x+=0;});
  /* sleeve */
  const sl=newPiece("Sleeve");sl.seam=10;sl.buffer=5;sl.qty=1;sl.oppositeX=true;sl.rotationAllow=true;
  const SP=(x,y,c,g)=>{const q=newPoint(x,y,c);if(g)q.grade=g;return q;};
  sl.points=[
    SP(0,90,false,{[mChest.id]:{dx:-0.08,dy:0}}),
    SP(115,12,true,null),
    SP(230,0,false,null),
    SP(345,12,true,null),
    SP(460,90,false,{[mChest.id]:{dx:0.08,dy:0}}),
    SP(420,90+220,false,{[mChest.id]:{dx:0.06,dy:0},[mSlv.id]:{dx:0,dy:1}}),
    SP(40,90+220,false,{[mChest.id]:{dx:-0.06,dy:0},[mSlv.id]:{dx:0,dy:1}}),
  ];
  sl.grain={x1:230,y1:60,x2:230,y2:260};
  sl.notches=[{seg:1,t:0.5},{seg:3,t:0.5}];
  /* offset pieces so they don't overlap on the sheet */
  back.points.forEach(pt=>{pt.x+=620;});back.grain.x1+=620;back.grain.x2+=620;
  sl.points.forEach(pt=>{pt.x+=1240;pt.y+=120;});sl.grain.x1+=1240;sl.grain.x2+=1240;sl.grain.y1+=120;sl.grain.y2+=120;
  p.pieces=[front,back,sl];
  S.patterns.push(p);S.activePatternId=p.id;
  S.sel={piece:null,point:null,placement:null};
  fitView("design");
  toast("Demo loaded — try Generate size… with chest 104 cm / L");
}
