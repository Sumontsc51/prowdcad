<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ProwdCAD PRO</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
:root{
  --bg:#0b0b0d; --panel:#141417; --panel2:#1b1b20; --line:#2a2a31; --line2:#3a3a44;
  --text:#e9e9ec; --dim:#8f8f9a; --accent:#ffb454; --sel:#3d9bff; --danger:#ff5c5c;
  --mono:"SF Mono","Cascadia Code",Consolas,"Liberation Mono",monospace;
  --sans:-apple-system,"Segoe UI",Inter,Roboto,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden}
body{background:var(--bg);color:var(--text);font:13px/1.4 var(--sans);display:flex;flex-direction:column}
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer}
input,select{font:12px var(--mono);color:var(--text);background:var(--panel2);border:1px solid var(--line);border-radius:3px;padding:3px 6px;outline:none}
input:focus,select:focus{border-color:var(--sel)}
input[type=checkbox]{accent-color:var(--accent);width:auto}
::-webkit-scrollbar{width:8px;height:8px}::-webkit-scrollbar-thumb{background:var(--line2);border-radius:4px}::-webkit-scrollbar-track{background:transparent}

/* ---- menu bar ---- */
#menubar{display:flex;align-items:center;height:34px;background:var(--panel);border-bottom:1px solid var(--line);padding:0 10px;user-select:none;z-index:60;position:relative}
#logo{font:600 12px var(--mono);letter-spacing:.14em;color:var(--accent);margin-right:14px;white-space:nowrap}
#logo span{color:var(--dim);font-weight:400}
#menus{display:flex;align-items:center;gap:1px}
.menu-root{position:relative}
.menu-root>button{padding:6px 10px;border-radius:4px;color:var(--text)}
.menu-root>button:hover,.menu-root.open>button{background:var(--panel2)}
.menu-drop{position:absolute;top:100%;left:0;min-width:210px;background:var(--panel2);border:1px solid var(--line2);border-radius:6px;padding:4px;display:none;box-shadow:0 10px 28px rgba(0,0,0,.55);z-index:100}
.menu-root.open>.menu-drop{display:block}
.menu-item{display:flex;align-items:center;gap:8px;width:100%;text-align:left;padding:6px 10px;border-radius:4px;white-space:nowrap;position:relative}
.menu-item:hover{background:rgba(255,255,255,.07)}
.menu-item.disabled{color:var(--dim);opacity:.5;pointer-events:none}
.menu-item .check{width:14px;font:11px var(--mono);color:var(--accent)}
.menu-item .hint{margin-left:auto;color:var(--dim);font:10px var(--mono);padding-left:16px}
.menu-sep{height:1px;background:var(--line);margin:4px 6px}
.menu-sub{position:relative}
.menu-sub>.menu-drop{top:-5px;left:100%}
.menu-sub:hover>.menu-drop{display:block}
#menubar .spacer{flex:1}
#unitwrap{display:flex;align-items:center;gap:6px;color:var(--dim);font:11px var(--mono)}
#statusmsg{margin-left:14px;font:11px var(--mono);color:var(--dim);max-width:340px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* ---- tabs ---- */
#tabs{display:flex;align-items:flex-end;background:var(--panel);border-bottom:1px solid var(--line);padding:0 10px;gap:2px;user-select:none}
.tab{padding:8px 18px 7px;font:600 11px var(--sans);letter-spacing:.09em;text-transform:uppercase;color:var(--dim);border:1px solid transparent;border-bottom:none;border-radius:7px 7px 0 0;position:relative;top:1px}
.tab.active{color:var(--text);background:var(--bg);border-color:var(--line)}
.tab:not(.active):hover{color:var(--text)}
#modebar{margin-left:auto;display:none;align-items:center;gap:2px;padding-bottom:5px}
#modebar.show{display:flex}
.mode-btn{padding:4px 11px;font:11px var(--mono);color:var(--dim);border:1px solid var(--line);border-radius:4px;background:var(--panel2)}
.mode-btn+.mode-btn{margin-left:-1px}
.mode-btn:first-child{border-radius:4px 0 0 4px}.mode-btn:last-child{border-radius:0 4px 4px 0}
.mode-btn.active{color:#111;background:var(--accent);border-color:var(--accent);font-weight:600}

/* ---- main ---- */
#main{flex:1;display:flex;min-height:0}
#sidebar{width:262px;background:var(--panel);border-right:1px solid var(--line);overflow-y:auto;padding:10px;display:flex;flex-direction:column;gap:12px}
.panel h3{font:600 10px var(--sans);letter-spacing:.12em;text-transform:uppercase;color:var(--dim);margin-bottom:7px;display:flex;align-items:center}
.lsgrp{border:1px solid var(--line);border-radius:5px;padding:7px 8px;margin-bottom:8px;background:rgba(255,255,255,.015)}
.lshd{display:flex;align-items:center;font:700 11px var(--sans);letter-spacing:.03em;margin-bottom:6px}
input[type=color]{border:1px solid var(--line);border-radius:3px;background:var(--panel2);cursor:pointer}
.panel h3 .pact{margin-left:auto;color:var(--accent);font:11px var(--mono);letter-spacing:0;text-transform:none;padding:1px 5px;border-radius:3px}
.panel h3 .pact:hover{background:rgba(255,180,84,.12)}
.row{display:flex;align-items:center;gap:6px;margin-bottom:5px}
.row label{flex:0 0 88px;color:var(--dim);font-size:11px}
.row input[type=text],.row input[type=number],.row select{flex:1;min-width:0}
.row input[type=checkbox]{flex:0}
.list{border:1px solid var(--line);border-radius:5px;background:var(--panel2);overflow:hidden}
.list-item{display:flex;align-items:center;gap:6px;padding:5px 8px;border-bottom:1px solid var(--line);cursor:pointer;font:12px var(--mono)}
.list-item:last-child{border-bottom:none}
.list-item:hover{background:rgba(255,255,255,.05)}
.list-item.active{background:rgba(61,155,255,.16);color:#bcdcff}
.list-item .sub{margin-left:auto;color:var(--dim);font-size:10px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:6px 10px;border:1px solid var(--line2);border-radius:5px;background:var(--panel2);color:var(--text);font:600 11px var(--sans)}
.btn:hover{border-color:var(--accent);color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#141414}
.btn.primary:hover{filter:brightness(1.08);color:#141414}
.btn.full{width:100%}
.btn.sm{padding:3px 8px;font-size:10px}
.gradetbl{width:100%;border-collapse:collapse;font:11px var(--mono)}
.gradetbl th{color:var(--dim);font-weight:400;text-align:left;padding:2px 4px;font-size:10px}
.gradetbl td{padding:2px 3px}
.gradetbl input{width:100%;padding:2px 4px;font-size:11px}
.hintline{color:var(--dim);font-size:10px;margin-top:4px;line-height:1.5}

/* ---- canvas ---- */
#canvaswrap{flex:1;position:relative;background:#39393f;min-width:0}
#svg{position:absolute;inset:0;width:100%;height:100%;display:block;background:#39393f;touch-action:none}
#floattool{position:absolute;top:12px;left:12px;background:var(--panel);border:1px solid var(--line2);border-radius:8px;padding:5px;display:flex;flex-direction:column;gap:3px;box-shadow:0 8px 22px rgba(0,0,0,.5);z-index:20}
#floattool button{width:36px;height:34px;border-radius:5px;color:var(--dim);font:600 11px var(--mono);display:flex;align-items:center;justify-content:center;position:relative}
#floattool button:hover{background:var(--panel2);color:var(--text)}
#floattool button.active{background:var(--accent);color:#141414}
#floattool button svg{width:19px;height:19px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;pointer-events:none}
#floattool button .tbadge{position:absolute;right:2px;bottom:0;font:700 8px var(--mono);color:currentColor;opacity:.85;pointer-events:none}
#floattool .flywrap{position:relative;display:flex}
#floattool .flytri{position:absolute;right:2px;bottom:2px;width:0;height:0;border-left:5px solid transparent;border-bottom:5px solid currentColor;pointer-events:none;opacity:.8}
#floattool .flymenu{position:absolute;left:calc(100% + 8px);top:0;background:var(--panel2);border:1px solid var(--line2);border-radius:8px;padding:4px;display:flex;flex-direction:column;gap:2px;box-shadow:0 10px 28px rgba(0,0,0,.55);z-index:120;white-space:nowrap}
#floattool .flymenu button{width:auto;height:30px;justify-content:flex-start;gap:9px;padding:0 12px 0 8px;color:var(--text)}
#floattool .flymenu button:hover{background:rgba(255,255,255,.07)}
#floattool .flymenu button.sel{color:var(--accent)}
#floattool .flymenu .flylabel{font:600 11px var(--sans);letter-spacing:.02em}
#floattool .tsep{height:1px;background:var(--line);margin:2px 3px}
#statsbar{position:absolute;left:0;right:0;bottom:0;height:26px;background:var(--panel);border-top:1px solid var(--line);display:flex;align-items:center;gap:22px;padding:0 14px;font:11px var(--mono);color:var(--dim);z-index:15}
#statsbar b{color:var(--text);font-weight:500}
#statsbar .warn{color:var(--danger)}

/* ---- dialogs ---- */
#overlay{position:fixed;inset:0;background:rgba(0,0,0,.6);display:none;align-items:center;justify-content:center;z-index:200}
#overlay.show{display:flex}
.dialog{background:var(--panel);border:1px solid var(--line2);border-radius:10px;min-width:380px;max-width:640px;max-height:82vh;display:flex;flex-direction:column;box-shadow:0 24px 70px rgba(0,0,0,.65)}
.dialog header{display:flex;align-items:center;padding:12px 16px;border-bottom:1px solid var(--line);font:600 13px var(--sans)}
.dialog header button{margin-left:auto;color:var(--dim);font-size:16px;padding:2px 6px}
.dialog header button:hover{color:var(--text)}
.dialog .body{padding:14px 16px;overflow-y:auto;font-size:12px;line-height:1.55}
.dialog footer{display:flex;justify-content:flex-end;gap:8px;padding:10px 16px;border-top:1px solid var(--line)}
.dialog h4{margin:10px 0 4px;font-size:12px;color:var(--accent)}
.dialog code{font:11px var(--mono);background:var(--panel2);padding:1px 5px;border-radius:3px}
#toast{position:fixed;bottom:38px;left:50%;transform:translateX(-50%);background:var(--panel2);border:1px solid var(--line2);color:var(--text);padding:8px 16px;border-radius:6px;font:12px var(--mono);opacity:0;transition:opacity .2s;pointer-events:none;z-index:300;box-shadow:0 8px 24px rgba(0,0,0,.5)}
#toast.show{opacity:1}
.dialog.wide{max-width:900px;min-width:560px}
.mchart{width:100%;border-collapse:collapse;font:11px var(--mono)}
.mchart th{color:var(--dim);font-weight:400;text-align:left;padding:3px 6px;border-bottom:1px solid var(--line);font-size:10px}
.mchart td{padding:3px 6px;border-bottom:1px solid var(--line);vertical-align:top}
.mchart td.num{text-align:right;white-space:nowrap}
.mchart .dim,.dim{color:var(--dim)} .good{color:#5ad17a} .bad{color:var(--danger)}
#modebar .mode-btn.keymap{margin-left:10px}
kbd{font:10px var(--mono);background:var(--panel2);border:1px solid var(--line2);border-bottom-width:2px;border-radius:3px;padding:0 4px}
</style>
</head>
<body>
<div id="menubar">
  <div id="logo">PROWD<span>&nbsp;CAD</span></div>
  <div id="menus"></div>
  <div id="statusmsg"></div>
  <div class="spacer"></div>
  <div id="unitwrap">units
    <select id="unitsel"><option value="mm">mm</option><option value="cm">cm</option><option value="inch">inch</option></select>
  </div>
</div>
<div id="tabs">
  <button class="tab" data-ws="design">Pattern Design</button>
  <button class="tab" data-ws="marker">Marker Making</button>
  <div id="modebar">
    <button class="mode-btn" data-mode="marker">Marker</button>
    <button class="mode-btn" data-mode="a4">A4 Tiles</button>
    <button class="mode-btn" data-mode="letter">US Letter</button>
    <button class="mode-btn" data-mode="a0">A0</button>
  </div>
</div>
<div id="main">
  <div id="sidebar"></div>
  <div id="canvaswrap">
    <svg id="svg" xmlns="http://www.w3.org/2000/svg"></svg>
    <div id="floattool"></div>
    <div id="statsbar"></div>
  </div>
</div>
<div id="overlay"><div class="dialog" id="dialog"></div></div>
<div id="toast"></div>
<input type="file" id="fileinput" hidden>
<script>
"use strict";
/* =========================================================
   ProwdCAD — single-pattern apparel CAD + marker making
   Internal units: millimetres. Screen y-axis points down.
   ========================================================= */

/* ---------- utilities ---------- */
const $=s=>document.querySelector(s), $$=s=>document.querySelectorAll(s);
const uid=()=>Math.random().toString(36).slice(2,10);
const clone=o=>JSON.parse(JSON.stringify(o));
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const deg=r=>r*180/Math.PI, rad=d=>d*Math.PI/180;
const store={get(k){try{return localStorage.getItem(k);}catch(e){return null;}},set(k,v){try{localStorage.setItem(k,v);}catch(e){}}};
let toastT=null;
function toast(msg){const t=$("#toast");t.textContent=msg;t.classList.add("show");clearTimeout(toastT);toastT=setTimeout(()=>t.classList.remove("show"),2600);}
function status(msg){$("#statusmsg").textContent=msg||"";}

/* ---------- units ---------- */
const UF={mm:1,cm:10,inch:25.4};
function fmt(mm,dp){const u=S.units;const v=mm/UF[u];const d=dp!=null?dp:(u==="mm"?1:u==="cm"?2:3);return (+v.toFixed(d)).toString();}
function fmtU(mm,dp){return fmt(mm,dp)+" "+S.units;}
function toMM(v){return (parseFloat(v)||0)*UF[S.units];}

/* ---------- state ---------- */
const S={
  units:store.get("wp.units")||"cm",
  view:Object.assign({seam:true,measurements:true,patternTool:true,movement:false,grid:true},
        JSON.parse(store.get("wp.view")||"{}")),
  workspace:"design",
  markerMode:"marker",
  patterns:[],            // in-session pattern library (each = one size)
  activePatternId:null,
  marker:null,            // {pattern:<embedded>, fabricWidth, shrinkX, shrinkY, placements:[], mode}
  tool:"select", curveMode:false,
  shapeKind:"rect",       // rect | ellipse | roundrect — active shape (flyout group)
  cornerR:20,             // rounded-rectangle corner radius (mm)
  perpBoth:false,         // perpendicular: single side | both sides
  op:null,                // multi-click op in progress {kind,...}
  penLast:null,           // {t,x,y} last pen click (manual double-click detection)
  ctx:null,               // context menu state
  sel:{piece:null,point:null,placement:null},
  draft:null,             // in-progress piece points
  fileName:{design:"untitled.wptn",marker:"untitled.wmrk"},
  vb:{design:null,marker:null},   // viewBoxes {x,y,w,h}
  msel:[],                // multi-selected points [{pc,i}] (rectangle select)
  keymap:store.get("wp.keymap")||"prowd",   // "prowd" | "tuka"
  programParam:null,
};
function saveView(){store.set("wp.view",JSON.stringify(S.view));}
function activePattern(){return S.patterns.find(p=>p.id===S.activePatternId)||null;}
function selPiece(){const p=activePattern();return p?p.pieces.find(pc=>pc.id===S.sel.piece)||null:null;}

/* ---------- model constructors ---------- */
function newPattern(name,size){
  return {type:"wptn",version:2,id:uid(),name:name||"Untitled",size:size||"M",
          measurements:[],pieces:[],derivedFrom:null,poms:[],targets:{},tolerance:7.62};
}
function defaultLineStyles(){
  return {
    perimeter:{color:"#000000",thickness:1.4,style:"solid",       label:{text:"",fontSize:12,visible:false}},
    internal: {color:"#0000FF",thickness:1.1,style:"solid",isCut:false, label:{text:"",fontSize:11,visible:false}},
    grain:    {color:"#008000",thickness:1.2,arrow:"double",     label:{text:"Straight Grain",fontSize:11,visible:false}},
    seam:     {color:"#FFA500",thickness:1.0,style:"dashed",     label:{text:"",fontSize:11,visible:false}},
  };
}
function newPiece(name){
  return {id:uid(),name:name||"Piece",points:[],seam:10,qty:1,buffer:5,
          rotationAllow:true,oppositeX:false,oppositeY:false,
          grain:null,notches:[],annotations:[],
          internals:[],       // [{x1,y1,x2,y2}] perpendiculars / internal lines (DXF layer 8)
          sym:null,           // {x1,y1,x2,y2,enabled} symmetric-edit axis
          styles:defaultLineStyles()};
}
/* back-fill styles + nested props on any piece (older files / demo) */
function normPieceStyles(pc){
  const d=defaultLineStyles();
  pc.styles=pc.styles||{};
  for(const k in d){
    pc.styles[k]=Object.assign({},d[k],pc.styles[k]||{});
    pc.styles[k].label=Object.assign({},d[k].label,(pc.styles[k]||{}).label||{});
  }
  return pc;
}
/* SVG dash-array (world units) for a line-style enum */
function dashFor(style,px){
  switch(style){
    case "dashed":  return `${6*px} ${4*px}`;
    case "dotted":  return `${1.2*px} ${3*px}`;
    case "dash-dot":return `${6*px} ${3*px} ${1.2*px} ${3*px}`;
    default:        return "";               // solid
  }
}
/* Anchor point model (Illustrator-style):
   {id,x,y, curve:bool, hIn:{x,y}|null, hOut:{x,y}|null, grade:{[measId]:{dx,dy}}}
   - corner point : hIn=hOut=null, curve=false → straight segments
   - smooth point : hIn,hOut present & mirrored (a "direction line" through the anchor)
   - hybrid point : one handle present, the other null (curved one side, straight other)
   Handles are ABSOLUTE coordinates (a "ball on a stick"), so they move with the anchor. */
function newPoint(x,y,curve){return {id:uid(),x,y,curve:!!curve,hIn:null,hOut:null,grade:{},name:""};}
function hOut(pt){return pt.hOut||null;}
function hIn(pt){return pt.hIn||null;}
function hasHandle(pt){return !!(pt.hIn||pt.hOut);}
/* set a smooth (mirrored) direction line through anchor pt, hOut pointing toward `dir` */
function setSmoothHandle(pt,hx,hy){
  pt.hOut={x:hx,y:hy};
  pt.hIn={x:2*pt.x-hx, y:2*pt.y-hy};
  pt.curve=true;
}
function moveHandlesWith(pt,dx,dy){
  if(pt.hIn){pt.hIn.x+=dx;pt.hIn.y+=dy;}
  if(pt.hOut){pt.hOut.x+=dx;pt.hOut.y+=dy;}
}

/* =========================================================
   GEOMETRY
   ========================================================= */
/* Centripetal Catmull-Rom (Barry–Goldman). Returns a point between P1 and P2 at
   parameter t∈[0,1]. Centripetal knot spacing removes the overshoot / cusps /
   self-loops that uniform CR produces on unevenly-spaced points. */
function crPoint(P0,P1,P2,P3,t){
  const eps=1e-6, alpha=0.5;
  const knot=(ti,A,B)=>ti+Math.max(eps,Math.pow(Math.hypot(B.x-A.x,B.y-A.y),alpha));
  const t0=0,t1=knot(t0,P0,P1),t2=knot(t1,P1,P2),t3=knot(t2,P2,P3);
  const tt=t1+(t2-t1)*t;
  const L=(A,B,ta,tb)=>{const d=(tb-ta)||eps,w=(tb-tt)/d,v=(tt-ta)/d;return {x:w*A.x+v*B.x,y:w*A.y+v*B.y};};
  const A1=L(P0,P1,t0,t1),A2=L(P1,P2,t1,t2),A3=L(P2,P3,t2,t3);
  const B1=L(A1,A2,t0,t2),B2=L(A2,A3,t1,t3);
  return L(B1,B2,t1,t2);
}
/* cubic Bézier point */
function bez(P0,C1,C2,P3,t){const u=1-t,uu=u*u,tt=t*t;
  return {x:uu*u*P0.x+3*uu*t*C1.x+3*u*tt*C2.x+tt*t*P3.x,
          y:uu*u*P0.y+3*uu*t*C1.y+3*u*tt*C2.y+tt*t*P3.y};}
/* Resolve one segment a→b to an evaluator. Explicit bézier handles win; otherwise
   legacy curve points use the centripetal spline; otherwise it's a straight line. */
function segEval(a,b,prev,next){
  if(a.hOut||b.hIn){                         // true Illustrator bézier
    const C1=a.hOut||a, C2=b.hIn||b;
    return t=>bez(a,C1,C2,b,t);
  }
  if(a.curve||b.curve){                      // legacy / demo / imported / shape curve points
    const P0=a.curve?(prev||a):a, P3=b.curve?(next||b):b;
    return t=>crPoint(P0,a,b,P3,t);
  }
  return null;                               // straight
}
/* Sample closed boundary. Returns [{x,y,seg,t}] (seg = index of segment start point). */
const SEG_STEPS=20;
function samplePiece(piece){
  const pts=piece.points,n=pts.length,out=[];
  if(n<3)return out;
  for(let i=0;i<n;i++){
    const a=pts[i],b=pts[(i+1)%n];
    const ev=segEval(a,b,pts[(i-1+n)%n],pts[(i+2)%n]);
    if(ev){for(let s=0;s<SEG_STEPS;s++){const q=ev(s/SEG_STEPS);out.push({x:q.x,y:q.y,seg:i,t:s/SEG_STEPS});}}
    else out.push({x:a.x,y:a.y,seg:i,t:0});
  }
  return out;
}
/* Sample an OPEN point list (live draft preview) — endpoints clamped, no wrap. */
function sampleOpen(points){
  const pts=points,n=pts.length,out=[];
  if(n<2)return pts.map(p=>({x:p.x,y:p.y}));
  for(let i=0;i<n-1;i++){
    const a=pts[i],b=pts[i+1];
    const ev=segEval(a,b,pts[i-1]||a,pts[i+2]||b);
    if(ev){for(let s=0;s<SEG_STEPS;s++)out.push(ev(s/SEG_STEPS));}
    else out.push({x:a.x,y:a.y});
  }
  out.push({x:pts[n-1].x,y:pts[n-1].y});
  return out;
}
function pointOnSegment(piece,seg,t){
  const pts=piece.points,n=pts.length;
  const a=pts[seg],b=pts[(seg+1)%n];
  const ev=segEval(a,b,pts[(seg-1+n)%n],pts[(seg+2)%n]);
  return ev?ev(t):{x:a.x+(b.x-a.x)*t,y:a.y+(b.y-a.y)*t};
}
function segTangent(piece,seg,t){
  const e=0.01,p1=pointOnSegment(piece,seg,Math.max(0,t-e)),p2=pointOnSegment(piece,seg,Math.min(1,t+e));
  const dx=p2.x-p1.x,dy=p2.y-p1.y,l=Math.hypot(dx,dy)||1;return {x:dx/l,y:dy/l};
}
function polyArea(poly){let a=0;for(let i=0;i<poly.length;i++){const p=poly[i],q=poly[(i+1)%poly.length];a+=p.x*q.y-q.x*p.y;}return a/2;}
function polyBBox(poly){let x1=1e18,y1=1e18,x2=-1e18,y2=-1e18;for(const p of poly){if(p.x<x1)x1=p.x;if(p.y<y1)y1=p.y;if(p.x>x2)x2=p.x;if(p.y>y2)y2=p.y;}return{x1,y1,x2,y2,w:x2-x1,h:y2-y1};}
function polyCentroid(poly){const b=polyBBox(poly);return{x:(b.x1+b.x2)/2,y:(b.y1+b.y2)/2};}
function segLen(piece,seg){ // arc length of cardinal segment
  let L=0,prev=pointOnSegment(piece,seg,0);
  for(let s=1;s<=SEG_STEPS;s++){const p=pointOnSegment(piece,seg,s/SEG_STEPS);L+=Math.hypot(p.x-prev.x,p.y-prev.y);prev=p;}
  return L;
}
/* True geometric offset (miter with bevel fallback). d>0 grows outward. */
function offsetPolygon(poly,d){
  const n=poly.length;if(n<3||Math.abs(d)<1e-9)return poly.map(p=>({x:p.x,y:p.y}));
  const sgn=polyArea(poly)>0?1:-1;      // outward normal = sgn*(dy,-dx)/|e|
  const lines=[];
  for(let i=0;i<n;i++){
    const a=poly[i],b=poly[(i+1)%n];
    const ex=b.x-a.x,ey=b.y-a.y,l=Math.hypot(ex,ey);
    if(l<1e-9)continue;
    const nx=sgn*ey/l,ny=-sgn*ex/l;
    lines.push({ax:a.x+nx*d,ay:a.y+ny*d,bx:b.x+nx*d,by:b.y+ny*d,ex,ey});
  }
  const m=lines.length,out=[];
  const miterLimit=Math.abs(d)*4+2;
  for(let i=0;i<m;i++){
    const L1=lines[i],L2=lines[(i+1)%m];
    const det=L1.ex*L2.ey-L1.ey*L2.ex;
    if(Math.abs(det)<1e-9){ out.push({x:L1.bx,y:L1.by}); continue; }
    const t=((L2.ax-L1.ax)*L2.ey-(L2.ay-L1.ay)*L2.ex)/det;
    const ix=L1.ax+L1.ex*t, iy=L1.ay+L1.ey*t;
    if(Math.hypot(ix-L1.bx,iy-L1.by)>miterLimit){ // bevel
      out.push({x:L1.bx,y:L1.by});out.push({x:L2.ax,y:L2.ay});
    }else out.push({x:ix,y:iy});
  }
  return out;
}
function pointInPoly(pt,poly){
  let inside=false;
  for(let i=0,j=poly.length-1;i<poly.length;j=i++){
    const xi=poly[i].x,yi=poly[i].y,xj=poly[j].x,yj=poly[j].y;
    if(((yi>pt.y)!==(yj>pt.y))&&(pt.x<(xj-xi)*(pt.y-yi)/(yj-yi)+xi))inside=!inside;
  }
  return inside;
}
function segsIntersect(p1,p2,p3,p4){
  const d=(p2.x-p1.x)*(p4.y-p3.y)-(p2.y-p1.y)*(p4.x-p3.x);
  if(Math.abs(d)<1e-12)return false;
  const u=((p3.x-p1.x)*(p4.y-p3.y)-(p3.y-p1.y)*(p4.x-p3.x))/d;
  const v=((p3.x-p1.x)*(p2.y-p1.y)-(p3.y-p1.y)*(p2.x-p1.x))/d;
  return u>0&&u<1&&v>0&&v<1;
}
function polysOverlap(A,B){
  const ba=polyBBox(A),bb=polyBBox(B);
  if(ba.x2<bb.x1||bb.x2<ba.x1||ba.y2<bb.y1||bb.y2<ba.y1)return false;
  for(let i=0;i<A.length;i++)for(let j=0;j<B.length;j++)
    if(segsIntersect(A[i],A[(i+1)%A.length],B[j],B[(j+1)%B.length]))return true;
  if(pointInPoly(A[0],B)||pointInPoly(B[0],A))return true;
  return false;
}
function transformPoly(poly,pl){ // placement {x,y,rot(deg),mx,my}
  const c=Math.cos(rad(pl.rot||0)),s=Math.sin(rad(pl.rot||0));
  return poly.map(p=>{
    let x=p.x*(pl.mx?-1:1),y=p.y*(pl.my?-1:1);
    return {x:pl.x+x*c-y*s, y:pl.y+x*s+y*c};
  });
}
/* ---- reflection across an arbitrary line (mirror / symmetric edit) ---- */
function reflectPoint(p,ax){
  const ux=ax.x2-ax.x1,uy=ax.y2-ax.y1,l2=ux*ux+uy*uy||1;
  const t=((p.x-ax.x1)*ux+(p.y-ax.y1)*uy)/l2;
  return {x:2*(ax.x1+ux*t)-p.x, y:2*(ax.y1+uy*t)-p.y};
}
function reflectVec(v,ax){ // reflect a delta vector {dx,dy} across axis DIRECTION
  const l=Math.hypot(ax.x2-ax.x1,ax.y2-ax.y1)||1,ux=(ax.x2-ax.x1)/l,uy=(ax.y2-ax.y1)/l;
  const d=(v.dx||0)*ux+(v.dy||0)*uy;
  return {dx:2*d*ux-(v.dx||0), dy:2*d*uy-(v.dy||0)};
}
function distToAxis(p,ax){const r=reflectPoint(p,ax);return Math.hypot(r.x-p.x,r.y-p.y)/2;}
/* twin point under symmetric edit (−1 = none / point sits on axis) */
function twinIndex(pc,idx){
  if(!pc.sym||!pc.sym.enabled)return -1;
  const pt=pc.points[idx];if(distToAxis(pt,pc.sym)<1)return -1;
  const r=reflectPoint(pt,pc.sym);let best=-1,bd=3;
  pc.points.forEach((q,i)=>{if(i===idx)return;const d=Math.hypot(q.x-r.x,q.y-r.y);if(d<bd){bd=d;best=i;}});
  return best;
}
function syncTwin(pc,idx,twin){ // mirror position + handles + Movement Program of idx onto its twin
  if(twin<0||!pc.sym||!pc.sym.enabled)return;
  const pt=pc.points[idx],tw=pc.points[twin],ax=pc.sym;
  const r=reflectPoint(pt,ax);tw.x=r.x;tw.y=r.y;tw.curve=pt.curve;
  // reflection reverses orientation → the reflected hOut becomes the twin's hIn and vice-versa
  tw.hIn = pt.hOut?reflectPoint(pt.hOut,ax):null;
  tw.hOut= pt.hIn ?reflectPoint(pt.hIn ,ax):null;
  tw.grade={};for(const m in (pt.grade||{}))tw.grade[m]=reflectVec(pt.grade[m],pc.sym);
}

/* =========================================================
   GRADING ENGINE (1.1)
   ========================================================= */
function generateSize(basePattern,sizeName,targets){
  const np=clone(basePattern);
  np.id=uid();np.size=sizeName;np.derivedFrom=basePattern.id;
  const deltas={};
  for(const m of basePattern.measurements)deltas[m.id]=(targets[m.id]??m.base)-m.base;
  for(const pc of np.pieces){
    let sumdx=0,sumdy=0,cnt=0;
    for(const pt of pc.points){
      let dx=0,dy=0;
      for(const mid in deltas){
        const g=pt.grade&&pt.grade[mid];
        if(g){dx+=(g.dx||0)*deltas[mid];dy+=(g.dy||0)*deltas[mid];}
      }
      pt.x+=dx;pt.y+=dy;moveHandlesWith(pt,dx,dy);sumdx+=dx;sumdy+=dy;cnt++;
    }
    if(cnt){ // grain, internal lines and symmetry axis follow mean displacement of the piece
      const mx=sumdx/cnt,my=sumdy/cnt;
      if(pc.grain){pc.grain.x1+=mx;pc.grain.y1+=my;pc.grain.x2+=mx;pc.grain.y2+=my;}
      (pc.internals||[]).forEach(il=>{il.x1+=mx;il.y1+=my;il.x2+=mx;il.y2+=my;});
      if(pc.sym){pc.sym.x1+=mx;pc.sym.y1+=my;pc.sym.x2+=mx;pc.sym.y2+=my;}
    }
    /* notches are parametric {seg,t} → follow automatically */
  }
  for(const m of np.measurements)m.base=targets[m.id]??m.base; // standalone pattern re-based
  return np;
}

/* =========================================================
   PRO 2.0 — HISTORY (Undo / Redo)
   Snapshot of the document (patterns + marker) after every settled render.
   Drags and pans are skipped; the release render records the result.
   ========================================================= */
const HIST={stack:[],pos:-1,max:150,mute:false};
function docState(){return JSON.stringify({patterns:S.patterns,active:S.activePatternId,marker:S.marker});}
function histCheckpoint(){
  if(HIST.mute||(typeof drag!=="undefined"&&drag))return;
  const s=docState();
  if(HIST.pos>=0&&HIST.stack[HIST.pos]===s)return;
  HIST.stack.splice(HIST.pos+1);HIST.stack.push(s);
  if(HIST.stack.length>HIST.max)HIST.stack.shift();
  HIST.pos=HIST.stack.length-1;
}
function histRestore(s){
  const j=JSON.parse(s);S.patterns=j.patterns;S.activePatternId=j.active;S.marker=j.marker;
  const p=activePattern();
  if(!p||!p.pieces.find(pc=>pc.id===S.sel.piece)){S.sel.piece=null;S.sel.point=null;}
  else{const pc=selPiece();if(S.sel.point!=null&&!pc.points[S.sel.point])S.sel.point=null;}
  if(S.marker&&S.sel.placement!=null&&!S.marker.placements[S.sel.placement])S.sel.placement=null;
  S.msel=[];S.op=null;
  HIST.mute=true;render();HIST.mute=false;
}
function undo(){if(HIST.pos<=0)return toast("Nothing to undo");HIST.pos--;histRestore(HIST.stack[HIST.pos]);status("Undo");}
function redo(){if(HIST.pos>=HIST.stack.length-1)return toast("Nothing to redo");HIST.pos++;histRestore(HIST.stack[HIST.pos]);status("Redo");}

/* =========================================================
   PRO 2.0 — MEASUREMENT CHART (TUKAdesign-compatible naming)
   • Name a grade point "03 Hip/m" → the contour from that point to the next
     grade (non-curve) point is measured. Same names add up across pieces.
   • /q2 overrides the multiplier (default = piece quantity incl. opposite pairs).
   • Measure tool (K / TUKA: M) saves straight or along-contour measurements.
   • Internal lines can be named the same way (right-click › Name internal line).
   ========================================================= */
function parseMeasName(s){
  if(s==null)return null;s=String(s).trim();if(!s)return null;
  const parts=s.split("/");const base=parts[0].trim();let m=false,q=null;
  for(const f of parts.slice(1)){const t=f.trim().toLowerCase();
    if(t==="m")m=true;else if(/^q\d+(\.\d+)?$/.test(t))q=parseFloat(t.slice(1));}
  return {base,m,q};
}
/* matching key: "01 High Waist" ≡ "Waist (High)" ≡ "high waist" */
function normMeas(s){
  return String(s||"").toLowerCase().replace(/^\s*\d+[\s._-]*/,"").replace(/\([^)]*\)/g,m=>" "+m.slice(1,-1)+" ")
    .replace(/[^a-z0-9]+/g," ").trim().split(/\s+/).filter(Boolean).sort().join(" ");
}
function pieceMult(pc){return (pc.qty||1)*(pc.oppositeX?2:1)*(pc.oppositeY?2:1);}
function contourRun(pc,i){             // segments from point i to the next grade (non-curve) point
  const n=pc.points.length;const segs=[i];let j=(i+1)%n,g=0;
  while(j!==i&&pc.points[j].curve&&g++<n){segs.push(j);j=(j+1)%n;}
  return {segs,end:j};
}
function contourLenBetween(pc,ia,ib,dir){ // along the outline from point ia to ib (dir +1 / −1)
  const n=pc.points.length;let L=0,i=ia,g=0;
  if(dir>0){while(i!==ib&&g++<=n){L+=segLen(pc,i);i=(i+1)%n;}}
  else{while(i!==ib&&g++<=n){const k=(i-1+n)%n;L+=segLen(pc,k);i=k;}}
  return L;
}
function findPt(p,ref){ // ref {pc:pieceId,id:pointId}
  const pc=p.pieces.find(x=>x.id===ref.pc);if(!pc)return null;
  const i=pc.points.findIndex(q=>q.id===ref.id);return i<0?null:{pc,i,pt:pc.points[i]};
}
function partLength(p,part){
  const a=findPt(p,part.a),b=findPt(p,part.b);if(!a||!b)return null;
  if(part.type==="contour"&&a.pc===b.pc)return contourLenBetween(a.pc,a.i,b.i,part.dir||1);
  if(part.type==="dx")return Math.abs(b.pt.x-a.pt.x);
  if(part.type==="dy")return Math.abs(b.pt.y-a.pt.y);
  return Math.hypot(b.pt.x-a.pt.x,b.pt.y-a.pt.y);
}
function partLabel(p,part){
  const a=findPt(p,part.a),b=findPt(p,part.b);if(!a||!b)return "(missing point)";
  const t={line:"straight",contour:"contour",dx:"X",dy:"Y"}[part.type]||part.type;
  return a.pc===b.pc?`${a.pc.name} · ${t} ${a.i+1}→${b.i+1}`:`${a.pc.name} ${a.i+1} → ${b.pc.name} ${b.i+1} · ${t}`;
}
function measureRows(p){
  const rows=new Map();
  const add=(name,label,len,q,src)=>{const k=normMeas(name)||name;let r=rows.get(k);
    if(!r){r={key:k,name,value:0,parts:[]};rows.set(k,r);}
    r.parts.push({label,len,q,src});r.value+=len*q;};
  if(!p)return [];
  for(const pc of p.pieces){
    pc.points.forEach((pt,i)=>{const nm=parseMeasName(pt.name);if(!nm||!nm.m)return;
      const run=contourRun(pc,i);let L=0;for(const s of run.segs)L+=segLen(pc,s);
      add(nm.base,`${pc.name} · pt ${i+1}→${run.end+1}`,L,nm.q!=null?nm.q:pieceMult(pc),{kind:"seg",pc:pc.id,id:pt.id});});
    const groups={};
    (pc.internals||[]).forEach(il=>{const nm=parseMeasName(il.name);if(!nm||!nm.m)return;
      const k=il.gid||il.name;(groups[k]=groups[k]||{nm,L:0}).L+=Math.hypot(il.x2-il.x1,il.y2-il.y1);});
    for(const k in groups){const g=groups[k];add(g.nm.base,`${pc.name} · internal line`,g.L,g.nm.q!=null?g.nm.q:pieceMult(pc),{kind:"int",pc:pc.id,gid:k});}
  }
  for(const pm of (p.poms||[]))for(const part of pm.parts){
    const L=partLength(p,part);if(L==null)continue;
    add(pm.name,partLabel(p,part),L,part.q!=null?part.q:1,{kind:"pom",pom:pm.id});
  }
  return [...rows.values()].sort((a,b)=>a.name.localeCompare(b.name,undefined,{numeric:true}));
}
function rowByKey(p,key){return measureRows(p).find(r=>r.key===key);}
function targetsOf(p){p.targets=p.targets||{};return p.targets;}   // key → {target(mm), tol(mm), label}
function tolOf(p,key){const t=targetsOf(p)[key];return t&&t.tol!=null?t.tol:(p.tolerance!=null?p.tolerance:3.175);}
function chartStatus(p,r){
  const t=targetsOf(p)[r.key];if(!t||t.target==null)return {diff:null,ok:null};
  const d=r.value-t.target;return {diff:d,ok:Math.abs(d)<=tolOf(p,r.key)+1e-9};
}
function showMeasurementChart(){
  const p=activePattern();if(!p)return toast("No active pattern");
  const rows=measureRows(p);
  const body=rows.length?`<table class="mchart"><tr><th>Measurement</th><th>Parts</th><th>Pattern</th><th>Target</th><th>Diff</th><th>Tol ±</th><th></th></tr>
    ${rows.map(r=>{const st=chartStatus(p,r),t=targetsOf(p)[r.key];
      return `<tr><td><b>${esc(r.name)}</b></td>
        <td class="dim">${r.parts.map(x=>`${esc(x.label)} = ${fmt(x.len)}${x.q!==1?` ×${x.q}`:""}`).join("<br>")}</td>
        <td class="num">${fmt(r.value)}</td>
        <td><input type="number" step="any" class="mc-t" data-k="${r.key}" value="${t&&t.target!=null?fmt(t.target):""}" style="width:72px"></td>
        <td class="num ${st.ok===false?"bad":st.ok?"good":""}">${st.diff==null?"":(st.diff>0?"+":"")+fmt(st.diff)}</td>
        <td><input type="number" step="any" class="mc-tol" data-k="${r.key}" value="${fmt(tolOf(p,r.key))}" style="width:56px"></td>
        <td>${st.ok==null?"":st.ok?'<span class="good">✓</span>':'<span class="bad">✗</span>'}</td></tr>`;}).join("")}
    </table>`
    :`<p>No measurements yet.</p><p class="hintline">Name a grade point with <code>/m</code> (e.g. <code>03 Hip/m/q2</code>) in the Point panel, or use the Measure tool (${keyFor("tool.measure")||"K"}) and “Add to chart”.</p>`;
  dialog(`Measurement Chart — ${esc(p.name)} (${S.units})`,body+
    `<p class="hintline" style="margin-top:8px">Contour = from the named grade point to the next grade point. /q overrides the count (default = piece quantity). Targets come from an order Excel or can be typed here.</p>`,
    [{label:"Export CSV",action:()=>{exportChartCSV(p);return false;}},
     {label:"Close",primary:true}]);
  $("#dialog").classList.add("wide");
  $$(".mc-t").forEach(i=>i.onchange=e=>{const k=e.target.dataset.k,v=e.target.value.trim();const t=targetsOf(p);
    t[k]=t[k]||{};t[k].target=v===""?null:toMM(v);t[k].label=t[k].label||(rows.find(r=>r.key===k)||{}).name;render();showMeasurementChart();});
  $$(".mc-tol").forEach(i=>i.onchange=e=>{const k=e.target.dataset.k;const t=targetsOf(p);t[k]=t[k]||{};t[k].tol=toMM(e.target.value);render();showMeasurementChart();});
}
function exportChartCSV(p){
  const rows=measureRows(p);const q=s=>`"${String(s).replace(/"/g,'""')}"`;
  const lines=[["Measurement","Pattern ("+S.units+")","Target","Diff","Tolerance","Status","Parts"].map(q).join(",")];
  for(const r of rows){const st=chartStatus(p,r),t=targetsOf(p)[r.key];
    lines.push([r.name,fmt(r.value),t&&t.target!=null?fmt(t.target):"",st.diff==null?"":fmt(st.diff),fmt(tolOf(p,r.key)),st.ok==null?"":st.ok?"PASS":"FAIL",
      r.parts.map(x=>x.label+" = "+fmt(x.len)+(x.q!==1?" x"+x.q:"")).join(" | ")].map(q).join(","));}
  download((p.name+"-measurements.csv").replace(/\s+/g,"_"),lines.join("\r\n"),"text/csv");
}
function esc(s){return String(s==null?"":s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));}

/* sidebar panel: compact live chart */
function buildChartPanel(sb,p){
  const rows=measureRows(p);
  const panel=el(`<div class="panel"><h3>Measurement Chart <button class="pact" id="mc-open" title="Shift+M">open ▸</button></h3></div>`);
  if(!rows.length)panel.appendChild(el(`<p class="hintline">Name points <code>…/m</code> or use the Measure tool to build the chart.</p>`));
  else{
    const list=el(`<div class="list"></div>`);
    rows.forEach(r=>{const st=chartStatus(p,r);
      list.appendChild(el(`<div class="list-item" style="cursor:default" title="${esc(r.parts.map(x=>x.label).join("\n"))}">
        <span style="flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis">${esc(r.name)}</span>
        <span>${fmt(r.value)}</span>${st.diff!=null?`<span class="sub ${st.ok?"good":"bad"}">${st.diff>0?"+":""}${fmt(st.diff)}</span>`:""}</div>`));});
    panel.appendChild(list);
  }
  sb.appendChild(panel);
  $("#mc-open").onclick=showMeasurementChart;

/* =========================================================
   PRO 2.0 — TOOLS: Measure · Move Point (Q) · Move Points (rect) · Program
   ========================================================= */
function snapAnchor(w,maxPx){const a=nearestAnchor(w,maxPx||14);if(!a)return null;const pt=a.piece.points[a.idx];return {pc:a.piece,i:a.idx,x:pt.x,y:pt.y};}
function measureClick(w){
  const a=snapAnchor(w);const pos=a||{x:w.x,y:w.y};
  if(!S.op||S.op.kind!=="measure"||S.op.b){S.op={kind:"measure",a:pos,cur:w};render();status("Measure: click the second point");return;}
  S.op.b=pos;render();showMeasureResult(S.op.a,S.op.b);
}
function showMeasureResult(a,b){
  const p=activePattern();
  const dx=b.x-a.x,dy=b.y-a.y,D=Math.hypot(dx,dy),ang=(deg(Math.atan2(-dy,dx))+360)%360;
  let fwd=null,bwd=null;
  if(a.pc&&b.pc&&a.pc===b.pc&&a.i!==b.i){fwd=contourLenBetween(a.pc,a.i,b.i,1);bwd=contourLenBetween(a.pc,a.i,b.i,-1);}
  const canSave=!!(a.pc&&b.pc);
  const names=measureRows(p).map(r=>r.name);
  dialog("Measure",`
    <table class="mchart">
      <tr><td>D (straight)</td><td class="num"><b>${fmtU(D)}</b></td></tr>
      <tr><td>X</td><td class="num">${fmtU(Math.abs(dx))}</td></tr>
      <tr><td>Y</td><td class="num">${fmtU(Math.abs(dy))}</td></tr>
      <tr><td>Angle</td><td class="num">${ang.toFixed(2)}°</td></tr>
      ${fwd!=null?`<tr><td>Contour →</td><td class="num">${fmtU(fwd)}</td></tr><tr><td>Contour ←</td><td class="num">${fmtU(bwd)}</td></tr>`:""}
    </table>
    ${canSave?`<h4>Add to Measurement Chart</h4>
      <div class="row"><label>Name</label><input id="ms-name" type="text" list="ms-names" placeholder="e.g. 08 Inseam"><datalist id="ms-names">${names.map(n=>`<option value="${esc(n)}">`).join("")}</datalist></div>

/* points (+internal endpoints) inside a world rectangle */
function pointsInRect(p,r,onlyPiece){
  const x1=Math.min(r.x1,r.x2),x2=Math.max(r.x1,r.x2),y1=Math.min(r.y1,r.y2),y2=Math.max(r.y1,r.y2);
  const inR=q=>q.x>=x1&&q.x<=x2&&q.y>=y1&&q.y<=y2;
  const pts=[],ints=[];
  for(const pc of p.pieces){if(onlyPiece&&pc!==onlyPiece)continue;
    pc.points.forEach((pt,i)=>{if(inR(pt))pts.push({pc:pc.id,i});});
    (pc.internals||[]).forEach((il,k)=>{const e1=inR({x:il.x1,y:il.y1}),e2=inR({x:il.x2,y:il.y2});if(e1||e2)ints.push({pc:pc.id,k,e1,e2});});
  }
  return {pts,ints};
}
function movePointsBy(p,sel,dx,dy){
  for(const s of sel.pts){const pc=p.pieces.find(x=>x.id===s.pc);const pt=pc&&pc.points[s.i];if(!pt)continue;
    pt.x+=dx;pt.y+=dy;moveHandlesWith(pt,dx,dy);}
  for(const s of (sel.ints||[])){const pc=p.pieces.find(x=>x.id===s.pc);const il=pc&&pc.internals[s.k];if(!il)continue;
    if(s.e1){il.x1+=dx;il.y1+=dy;}if(s.e2){il.x2+=dx;il.y2+=dy;}}
}

/* =========================================================
   PRO 2.0 — ALTERATION SOLVER (made-to-measure)
   Parameters = pattern.measurements (Movement Programs on points).
   Each target row with a parameter of the same name is solved with Newton
   iterations on a finite-difference Jacobian, so curves, quantities and
   multi-part measurements all land on target.
   ========================================================= */
function applyParamDeltas(base,deltas){ // deltas {paramId: mm}; returns new pattern (not registered)
  const targets={};for(const m of base.measurements)targets[m.id]=m.base+(deltas[m.id]||0);
  return generateSize(base,base.size,targets);
}
function solveSquare(A,b){ // Gaussian elimination with partial pivoting; returns x or null
  const n=b.length,M=A.map((r,i)=>[...r,b[i]]);
  for(let c=0;c<n;c++){let piv=c;for(let r=c+1;r<n;r++)if(Math.abs(M[r][c])>Math.abs(M[piv][c]))piv=r;
    if(Math.abs(M[piv][c])<1e-12)return null;[M[c],M[piv]]=[M[piv],M[c]];
    for(let r=0;r<n;r++){if(r===c)continue;const f=M[r][c]/M[c][c];for(let k=c;k<=n;k++)M[r][k]-=f*M[c][k];}}
  return M.map((r,i)=>r[n]/r[i]);
}
function alterToTargets(base,opts){
  opts=opts||{};
  const tg=targetsOf(base);
  /* pair each target row with the parameter of the same name */
  const rows0=measureRows(base);
  const pairs=[];
  for(const r of rows0){const t=tg[r.key];if(!t||t.target==null)continue;
    const m=base.measurements.find(mm=>normMeas(mm.name)===r.key);
    const programmed=m&&base.pieces.some(pc=>pc.points.some(pt=>pt.grade&&pt.grade[m.id]&&(pt.grade[m.id].dx||pt.grade[m.id].dy)));
    pairs.push({key:r.key,name:r.name,target:t.target,param:programmed?m.id:null,start:r.value});}
  const active=pairs.filter(x=>x.param);
  const valuesOf=pat=>{const rs=measureRows(pat);const o={};for(const r of rs)o[r.key]=r.value;return o;};
  const errOf=pt=>{const v=valuesOf(pt);return active.map(x=>(v[x.key]??0)-x.target);};
  const norm2=F=>Math.sqrt(F.reduce((s,f)=>s+f*f,0));
  let u={};active.forEach(x=>u[x.param]=0);
  let pat=base,F=errOf(pat),log=[];
  const cap=Math.max(50,...active.map(x=>Math.abs(x.target-x.start)*3));   // never move a parameter wildly
  for(let it=0;it<25&&active.length;it++){
    const err=Math.max(...F.map(Math.abs));log.push(err);
    if(err<0.02)break;                                          // 0.02 mm
    const h=1,v0=valuesOf(pat);const J=active.map(()=>active.map(()=>0));
    active.forEach((xj,j)=>{const u2=Object.assign({},u);u2[xj.param]+=h;
      const v2=valuesOf(applyParamDeltas(base,u2));active.forEach((xi,i)=>{J[i][j]=((v2[xi.key]??0)-(v0[xi.key]??0))/h;});});
    let du=solveSquare(J,F.map(f=>-f));
    if(!du||du.some(d=>!isFinite(d)))du=active.map((x,i)=>Math.abs(J[i][i])>1e-9?-F[i]/J[i][i]:0);   // diagonal fallback
    /* backtracking: accept only steps that reduce the error */
    let step=1,ok=false;
    for(let b=0;b<12;b++){const un=Object.assign({},u);
      active.forEach((x,j)=>un[x.param]=clamp(u[x.param]+du[j]*step,-cap,cap));
      const pn=applyParamDeltas(base,un),Fn=errOf(pn);
      if(norm2(Fn)<norm2(F)){u=un;pat=pn;F=Fn;ok=true;break;}step/=2;}
    if(!ok)break;                                              // can't improve further (conflicting rules)
  }
  if(pat===base)pat=applyParamDeltas(base,u);
  const vEnd=valuesOf(pat);
  const report=pairs.map(x=>({name:x.name,key:x.key,start:x.start,target:x.target,result:vEnd[x.key],programmed:!!x.param,
    ok:Math.abs((vEnd[x.key]??0)-x.target)<=tolOf(base,x.key)+1e-9}));
  return {pattern:pat,report,iterations:log.length};
}

/* =========================================================
   PRO 2.0 — SCALE & SHRINK (Shift+Enter)
   Warp = along each piece's grain line, weft = across it.
   "Proportional to 100%": L ÷ (1 − s) so the piece washes back to exact size.
   ========================================================= */
function pieceGrainAxis(pc,fallback){
  if(pc.grain){const dx=pc.grain.x2-pc.grain.x1,dy=pc.grain.y2-pc.grain.y1,l=Math.hypot(dx,dy);if(l>1e-6)return {x:dx/l,y:dy/l};}
  return fallback==="x"?{x:1,y:0}:{x:0,y:1};
}
function scalePiece(pc,kW,kF,axisFallback){
  const u=pieceGrainAxis(pc,axisFallback),v={x:-u.y,y:u.x};
  const bb=polyBBox(samplePiece(pc));const c={x:(bb.x1+bb.x2)/2,y:(bb.y1+bb.y2)/2};
  const T=q=>{const rx=q.x-c.x,ry=q.y-c.y;const a=(rx*u.x+ry*u.y)*kW,b=(rx*v.x+ry*v.y)*kF;return {x:c.x+a*u.x+b*v.x,y:c.y+a*u.y+b*v.y};};
  const TP=o=>{const r=T(o);o.x=r.x;o.y=r.y;};
  pc.points.forEach(pt=>{TP(pt);if(pt.hIn)TP(pt.hIn);if(pt.hOut)TP(pt.hOut);});
  (pc.internals||[]).forEach(il=>{const a=T({x:il.x1,y:il.y1}),b=T({x:il.x2,y:il.y2});il.x1=a.x;il.y1=a.y;il.x2=b.x;il.y2=b.y;});
  if(pc.grain){const a=T({x:pc.grain.x1,y:pc.grain.y1}),b=T({x:pc.grain.x2,y:pc.grain.y2});pc.grain={x1:a.x,y1:a.y,x2:b.x,y2:b.y};}
  if(pc.sym){const a=T({x:pc.sym.x1,y:pc.sym.y1}),b=T({x:pc.sym.x2,y:pc.sym.y2});Object.assign(pc.sym,{x1:a.x,y1:a.y,x2:b.x,y2:b.y});}
}
function shrinkFactor(s,proportional){return proportional?1/Math.max(0.01,1-s):1+s;}
function makeShrunkPattern(p,warp,weft,opts){
  opts=opts||{};
  const np=clone(p);np.id=uid();np.derivedFrom=p.id;
  np.name=opts.name||(p.name+" POSTSHRINK");
  np.shrink={warp,weft,proportional:opts.proportional!==false};
  const kW=shrinkFactor(warp,opts.proportional!==false),kF=shrinkFactor(weft,opts.proportional!==false);
  np.pieces.forEach(pc=>{if(opts.onlyPiece&&pc.id!==opts.onlyPiece)return;scalePiece(pc,kW,kF,opts.axis||"y");
    if(opts.scaleSeam)pc.seam*=Math.max(kW,kF);
    if(opts.describe)pc.annotations=[...(pc.annotations||[]),`Shrink warp ${(warp*100).toFixed(2)}% weft ${(weft*100).toFixed(2)}%`];});
  np.targets={};   // targets were for the preshrink garment
  return np;
}

/* =========================================================
   PRO 2.0 — PIECE COMMANDS (flip / rotate / copy / paste / zoom)
   ========================================================= */
function transformPieceXY(pc,f){
  const TP=o=>{const r=f(o);o.x=r.x;o.y=r.y;};
  pc.points.forEach(pt=>{TP(pt);if(pt.hIn)TP(pt.hIn);if(pt.hOut)TP(pt.hOut);});
  (pc.internals||[]).forEach(il=>{const a=f({x:il.x1,y:il.y1}),b=f({x:il.x2,y:il.y2});il.x1=a.x;il.y1=a.y;il.x2=b.x;il.y2=b.y;});
  if(pc.grain){const a=f({x:pc.grain.x1,y:pc.grain.y1}),b=f({x:pc.grain.x2,y:pc.grain.y2});pc.grain={x1:a.x,y1:a.y,x2:b.x,y2:b.y};}
  if(pc.sym){const a=f({x:pc.sym.x1,y:pc.sym.y1}),b=f({x:pc.sym.x2,y:pc.sym.y2});Object.assign(pc.sym,{x1:a.x,y1:a.y,x2:b.x,y2:b.y});}
}
function reversePieceOrder(pc){ // after a reflection: keep winding; notches remap
  const n=pc.points.length;
  pc.points.reverse();pc.points.forEach(pt=>{const h=pt.hIn;pt.hIn=pt.hOut;pt.hOut=h;});
  pc.notches=(pc.notches||[]).map(nt=>({seg:(n-2-nt.seg+n)%n,t:1-nt.t}));
}
function targetPieces(){const p=activePattern();if(!p)return[];const pc=selPiece();return pc?[pc]:p.pieces;}
function flipPieces(axis){
  const pcs=targetPieces();if(!pcs.length)return toast("No piece");
  for(const pc of pcs){const bb=polyBBox(samplePiece(pc)),cx=(bb.x1+bb.x2)/2,cy=(bb.y1+bb.y2)/2;
    transformPieceXY(pc,q=>axis==="h"?{x:2*cx-q.x,y:q.y}:{x:q.x,y:2*cy-q.y});reversePieceOrder(pc);}
  render();toast(`Flipped ${axis==="h"?"horizontally":"vertically"} (${pcs.length} piece${pcs.length===1?"":"s"})`);
}
function rotatePieces(degCW){
  const pcs=targetPieces();if(!pcs.length)return toast("No piece");
  const a=rad(degCW),c=Math.cos(a),s=Math.sin(a);
  for(const pc of pcs){const bb=polyBBox(samplePiece(pc)),cx=(bb.x1+bb.x2)/2,cy=(bb.y1+bb.y2)/2;
    transformPieceXY(pc,q=>({x:cx+(q.x-cx)*c-(q.y-cy)*s,y:cy+(q.x-cx)*s+(q.y-cy)*c}));}
  render();
}
let pieceClipboard=null;
function copyPiece(){const pc=selPiece();if(!pc)return toast("Select a piece");pieceClipboard=clone(pc);toast(`Copied “${pc.name}”`);}
function pastePiece(){

      <tr><td>Grain angle</td><td class="num">${grainAngle(pc.grain).toFixed(1)}°</td></tr>

/* =========================================================
   PRO 2.0 — ORDER (made-to-measure from an order Excel)
   Reads the Neems "Pattern Sheet" (or any sheet with a measurement/target
   table), fills chart targets, shrinkage and fabric width, and can run the
   whole chain: alter → postshrink → marker.
   ========================================================= */
function sheetJSready(){if(!window.XLSX){toast("SheetJS not loaded (offline?) — Excel import unavailable");return false;}return true;}
const ORDER_MEAS_ALIASES={  // excel label → chart key family (normalised); extend freely
  "waist high":"high waist","waist":"waist","hip":"hip","seat":"hip","upper thigh":"upper thigh","thigh":"upper thigh",
  "mid thigh":"mid thigh","knee":"knee","calf":"calf","ankle":"ankle","ankle leg opening":"ankle","leg opening":"ankle","hem":"ankle",
  "inseam":"inseam","total rise":"total rise","front rise":"front rise","back rise":"back rise","outseam":"outseam","low waist":"low waist",
  "crotch to hip":"crotch to hip","top of waistband":"waistband","waistband":"waistband"};
function aliasKey(label){const k=normMeas(label);const a=ORDER_MEAS_ALIASES[k];return a?normMeas(a):k;}
function cellNum(v){
  if(v==null||v==="")return null;if(typeof v==="number")return v;
  let s=String(v).trim().replace(/["”]/g,"");
  let m=s.match(/^(-?\d+)\s+(\d+)\/(\d+)$/);if(m)return (+m[1])+(+m[2]/+m[3])*(+m[1]<0?-1:1);
  m=s.match(/^(\d+)\/(\d+)$/);if(m)return +m[1]/+m[2];
  m=s.match(/^(-?\d*\.?\d+)\s*(%|in|inch|inches|cm|mm)?/i);if(!m)return null;
  let n=parseFloat(m[1]);return n;
}
function parseOrderWorkbook(wb){
  const o={title:"",name:"",pattern:"",rows:[],warp:null,weft:null,fabricWidth:null,units:"inch",info:[]};
  const grid=[];
  for(const sn of wb.SheetNames){const ws=wb.Sheets[sn];const aoa=XLSX.utils.sheet_to_json(ws,{header:1,raw:true,defval:null});aoa.forEach(r=>grid.push(r));}
  const txt=r=>r.map(c=>c==null?"":String(c));
  /* header line */
  for(const r of grid){const t=txt(r).join(" ");if(/order\s*#?\s*\d+/i.test(t)){o.title=t.trim();const m=t.match(/order\s*#?\s*(\d+)/i);o.number=m?m[1]:"";break;}}
  for(let i=0;i<grid.length;i++){const t=txt(grid[i]).join(" ").trim();
    if(/recommended starting pattern/i.test(t)&&grid[i+1]){o.pattern=txt(grid[i+1]).find(x=>x)||"";}
    if(/custom\s*\(([^)]+)\)/i.test(t)){o.name=t.match(/custom\s*\(([^)]+)\)/i)[1].trim();}
  }
  /* measurement table: header row containing "Preshrink Target" or "MEDIDA_MOLDE" */
  for(let i=0;i<grid.length;i++){const hdr=txt(grid[i]).map(x=>x.toLowerCase());
    let tc=hdr.findIndex(h=>/preshrink\s*target|medida_molde|target/.test(h));
    if(tc<0)continue;
    const nc=hdr.findIndex(h=>/^(measurement|english|pom|point of measure|description)$/.test(h.trim()));
    const nameCol=nc>=0?nc:0;
    const sc=hdr.findIndex(h=>/starting\s*pattern|pattern$/.test(h));
    let blanks=0,found=0;
    for(let r=i+1;r<grid.length;r++){const row=grid[r];const nm=row[nameCol];
      if(nm!=null&&/^\s*(adjustment\s*=|key information|shrinkage|garment measurements|notes?)\b/i.test(String(nm)))break;
      const v=cellNum(row[tc]);
      if(nm==null||String(nm).trim()===""||v==null){if(++blanks>1&&found)break;continue;}blanks=0;
      if(v<=0)continue;                                  // "0" / "—" = not specified
      o.rows.push({label:String(nm).trim(),key:aliasKey(nm),target:v,start:sc>=0?cellNum(row[sc]):null});found++;}
    if(found)break;
  }
  /* key information */
  const near=(re)=>{for(const r of grid){const t=txt(r);for(let c=0;c<t.length;c++){if(re.test(t[c])){for(let k=c+1;k<t.length;k++){if(t[k]!=="")return r[k];}}}}return null;};
  const pct=v=>{const n=cellNum(v);if(n==null)return null;return (typeof v==="string"&&/%/.test(v))||n>1?n/100:n;};
  o.warp=pct(near(/warp/i));o.weft=pct(near(/weft/i));
  const fw=near(/fabric\s*width/i);o.fabricWidth=cellNum(fw);
  const hem=near(/hem\s*type/i);if(hem)o.info.push("Hem: "+hem);
  const fly=near(/fly\s*type/i);if(fly)o.info.push("Fly: "+fly);
  const tol=near(/tolerance/i);o.tolerance=cellNum(tol);
  if(/cm\b/i.test(JSON.stringify(grid).slice(0,2000))&&!/inch|"/.test(JSON.stringify(grid).slice(0,2000)))o.units="cm";
  return o;
}
function unitToMM(v,u){return v==null?null:v*(u==="inch"?25.4:u==="cm"?10:1);}
function importOrderFile(file){
  if(!sheetJSready())return;
  const rd=new FileReader();
  rd.onload=()=>{let wb;try{wb=XLSX.read(rd.result,{type:"array"});}catch(e){return toast("Could not read Excel: "+e.message);}
    const o=parseOrderWorkbook(wb);o.file=file.name;

}

/* one-click chain for an order: alter → postshrink → marker */
function runOrderChain(){

/* =========================================================
   PRO 2.0 — MARKER: auto-nest (bottom-left fill) + HPGL/PLT export
   ========================================================= */
function autoNest(opts){
  const M=S.marker;if(!M)return;
  opts=opts||{};const gap=opts.gap!=null?opts.gap:3,W=M.fabricWidth;
  const items=M.placements.map((pl,i)=>{const pc=M.pattern.pieces.find(x=>x.id===pl.pieceId);
    /* grain must run along the fabric length (x). Mirrored copies flip the grain angle. */
    let g=pc&&pc.grain?grainAngle(pc.grain):90;if(pl.mx)g=180-g;if(pl.my)g=-g;
    const g0=((Math.round(g*100)/100)%360+360)%360;
    const rots=pc&&pc.rotationAllow?[g0,(g0+180)%360]:[g0];
    const cands=rots.map(rot=>{const poly=placementPoly(Object.assign({},pl,{x:0,y:0,rot}),true);const bb=polyBBox(poly);return {rot,bb,area:bb.w*bb.h};});
    return {i,pl,cands,area:Math.abs(polyArea(placementPoly(Object.assign({},pl,{x:0,y:0,rot:0}),false)))};}).sort((a,b)=>b.area-a.area);
  const placed=[];   // bounding boxes {x1,y1,x2,y2}
  const fits=(bb,x,y)=>{if(y+bb.h>W+1e-6||y<-1e-6||x<-1e-6)return false;for(const q of placed){if(x<q.x2&&x+bb.w>q.x1&&y<q.y2&&y+bb.h>q.y1)return false;}return true;};
  for(const it of items){
    let best=null;
    const xs=[0,...placed.map(q=>q.x2)],ys=[0,...placed.map(q=>q.y2)];
    for(const c of it.cands)for(const x of xs)for(const y of ys){
      if(!fits(c.bb,x,y))continue;
      const score=(x+c.bb.w)*1000+y; if(!best||score<best.score)best={score,x,y,c};}
    if(!best){const x=Math.max(0,...placed.map(q=>q.x2));best={x,y:0,c:it.cands[0]};}
    const {x,y,c}=best;it.pl.rot=c.rot;it.pl.x=x-c.bb.x1+gap/2;it.pl.y=y-c.bb.y1+gap/2;
    placed.push({x1:x,y1:y,x2:x+c.bb.w+gap,y2:y+c.bb.h+gap});
  }
  /* precise fix-up: nudge any true-polygon overlaps apart along x */
  for(let i=0;i<M.placements.length;i++){let g=0;while(!placementValid(i)&&g++<200)M.placements[i].x+=2;}
}
function exportPLT(fname){
  const M=S.marker;if(!M)return toast("Marker is empty");
  const U=40;const L=[];L.push("IN;SP1;");
  const pen=(x,y,down)=>L.push(`${down?"PD":"PU"}${Math.round(x*U)},${Math.round(y*U)};`);
  for(const pl of M.placements){
    const poly=placementPoly(pl,false);if(poly.length<3)continue;
    poly.forEach((q,k)=>pen(q.x,-q.y+M.fabricWidth,k>0));pen(poly[0].x,-poly[0].y+M.fabricWidth,true);
    const pc=M.pattern.pieces.find(x=>x.id===pl.pieceId);const sc=shrinkScale();
    if(pc){for(const il of (pc.internals||[])){const tp=transformPoly([{x:il.x1*sc.x,y:il.y1*sc.y},{x:il.x2*sc.x,y:il.y2*sc.y}],pl);
        pen(tp[0].x,-tp[0].y+M.fabricWidth,false);pen(tp[1].x,-tp[1].y+M.fabricWidth,true);}
      if(pc.grain){const tp=transformPoly([{x:pc.grain.x1*sc.x,y:pc.grain.y1*sc.y},{x:pc.grain.x2*sc.x,y:pc.grain.y2*sc.y}],pl);
        pen(tp[0].x,-tp[0].y+M.fabricWidth,false);pen(tp[1].x,-tp[1].y+M.fabricWidth,true);}
      for(const nt of (pc.notches||[])){const q=pointOnSegment(pc,nt.seg,nt.t),tg=segTangent(pc,nt.seg,nt.t);
        const a=transformPoly([{x:q.x*sc.x,y:q.y*sc.y},{x:(q.x-tg.y*6)*sc.x,y:(q.y+tg.x*6)*sc.y}],pl);
        pen(a[0].x,-a[0].y+M.fabricWidth,false);pen(a[1].x,-a[1].y+M.fabricWidth,true);}
    }
  }
  L.push("PU0,0;SP0;IN;");
  download(fname||((M.pattern.name+".plt").replace(/\s+/g,"_")),L.join("\n"),"application/octet-stream");
  toast("PLT exported (40 units/mm)");
}

/* =========================================================
   PRO 2.0 — DXF IMPORT v2: BLOCK/INSERT per piece (TUKAcad, Gerber, Lectra, Optitex)
   ========================================================= */
function parseDXFFull(txt){
  const raw=txt.split(/\r\n|\r|\n/);const pairs=[];
  for(let i=0;i+1<raw.length;i+=2)pairs.push([raw[i].trim(),raw[i+1]]);
  const ents=[],blocks={};let i=0,cur=null,curBlock=null,section="";
  const ENT=new Set(["LINE","LWPOLYLINE","POLYLINE","VERTEX","SEQEND","POINT","TEXT","MTEXT","SPLINE","ARC","CIRCLE","INSERT"]);
  const flush=()=>{if(cur){(curBlock?curBlock.ents:ents).push(cur);cur=null;}};
  while(i<pairs.length){const [c,v]=pairs[i];const val=v.trim();
    if(c==="0"){flush();
      if(val==="SECTION"){section=pairs[i+1]?pairs[i+1][1].trim():"";}
      else if(val==="BLOCK"){curBlock={name:"",ents:[],bx:0,by:0};}
      else if(val==="ENDBLK"){if(curBlock){blocks[curBlock.name]=curBlock;}curBlock=null;}
      else if(ENT.has(val)){cur={etype:val,layer:"0",pts:[],x:0,y:0,x2:0,y2:0,text:"",closed:false,name:"",rot:0,sx:1,sy:1,fit:[],ctrl:[],bulge:[]};}
      i++;continue;}
    if(cur){const f=parseFloat(val);
      if(c==="8")cur.layer=val;else if(c==="2")cur.name=val;else if(c==="70")cur.closed=((parseInt(val)||0)&1)===1;
      else if(c==="10"){if(cur.etype==="LWPOLYLINE")cur.pts.push({x:f,y:0});else if(cur.etype==="SPLINE")cur.ctrl.push({x:f,y:0});else cur.x=f;}
      else if(c==="20"){if(cur.etype==="LWPOLYLINE")cur.pts[cur.pts.length-1].y=-f;else if(cur.etype==="SPLINE")cur.ctrl[cur.ctrl.length-1].y=-f;else cur.y=-f;}
      else if(c==="11"){if(cur.etype==="SPLINE")cur.fit.push({x:f,y:0});else cur.x2=f;}
      else if(c==="21"){if(cur.etype==="SPLINE")cur.fit[cur.fit.length-1].y=-f;else cur.y2=-f;}
      else if(c==="42"&&cur.etype==="LWPOLYLINE")cur.bulge[cur.pts.length-1]=f;
      else if(c==="1")cur.text=val;else if(c==="50")cur.rot=f;else if(c==="41")cur.sx=f;else if(c==="42")cur.sy=f;}
    else if(curBlock){if(c==="2")curBlock.name=val;else if(c==="10")curBlock.bx=parseFloat(val);else if(c==="20")curBlock.by=-parseFloat(val);}
    i++;}
  flush();
  const stitch=list=>{const out=[];for(let k=0;k<list.length;k++){const e=list[k];
    if(e.etype==="POLYLINE"){const pl={etype:"POLY",layer:e.layer,pts:[],closed:e.closed};k++;
      while(k<list.length&&list[k].etype==="VERTEX"){pl.pts.push({x:list[k].x,y:list[k].y});k++;}
      if(k<list.length&&list[k].etype!=="SEQEND")k--;out.push(pl);}
    else if(e.etype==="LWPOLYLINE")out.push({etype:"POLY",layer:e.layer,pts:e.pts,closed:e.closed});
    else if(e.etype==="SPLINE"){const pts=e.fit.length>=2?e.fit:e.ctrl;out.push({etype:"POLY",layer:e.layer,pts:sampleOpen(pts.map(q=>({x:q.x,y:q.y,curve:true,hIn:null,hOut:null}))),closed:false,spline:true});}
    else if(e.etype!=="VERTEX"&&e.etype!=="SEQEND")out.push(e);}
    return out;};
  for(const b in blocks)blocks[b].ents=stitch(blocks[b].ents);
  return {ents:stitch(ents),blocks};
}
function importDXF2(txt,fname){
  let d;try{d=parseDXFFull(txt);}catch(err){return toast("DXF parse failed: "+err.message);}
  const inserts=d.ents.filter(e=>e.etype==="INSERT"&&d.blocks[e.name]&&d.blocks[e.name].ents.some(x=>x.etype==="POLY"&&LAYER_MAP[x.layer]==="boundary"));
  if(!inserts.length)return importDXF(txt,fname);           // flat file → v1 importer
  const report={pieces:0,notches:0,grains:0,texts:0,internals:0,sew:0,unknownLayers:{},unsupported:{}};
  const pat=newPattern(fname.replace(/\.dxf$/i,""),"import");
  const place=(e,q)=>{const b=d.blocks[e.name];const c=Math.cos(rad(-e.rot||0)),s=Math.sin(rad(-e.rot||0));
    const x=(q.x-b.bx)*(e.sx||1),y=(q.y-b.by)*(e.sy||1);return {x:e.x+x*c-y*s,y:e.y+x*s+y*c};};
  const all=[];
  for(const ins of inserts){const b=d.blocks[ins.name];
    const bnd=b.ents.filter(x=>x.etype==="POLY"&&LAYER_MAP[x.layer]==="boundary").sort((a,c)=>Math.abs(polyArea(c.pts))-Math.abs(polyArea(a.pts)))[0];
    const sew=b.ents.find(x=>x.etype==="POLY"&&LAYER_MAP[x.layer]==="sew");
    const pc=newPiece(ins.name);pc.seam=0;
    let pts=bnd.pts.map(q=>place(ins,q));if(pts.length>1&&Math.hypot(pts[0].x-pts[pts.length-1].x,pts[0].y-pts[pts.length-1].y)<0.01)pts.pop();
    const turn=b.ents.filter(x=>x.etype==="POINT"&&LAYER_MAP[x.layer]==="turn").map(q=>place(ins,q));
    const curv=b.ents.filter(x=>x.etype==="POINT"&&LAYER_MAP[x.layer]==="curvept").map(q=>place(ins,q));
    /* if the file marks turn points, treat every other vertex as a curve point (TUKA/Gerber convention) */
    pc.points=pts.map(q=>{const isTurn=turn.length?turn.some(t=>Math.hypot(t.x-q.x,t.y-q.y)<0.3):true;
      const isCurve=curv.some(t=>Math.hypot(t.x-q.x,t.y-q.y)<0.3)||(turn.length&&!isTurn);return newPoint(q.x,q.y,isCurve);});
    if(pc.points.length<3)continue;
    if(sew&&sew.pts.length>=3){const sp=sew.pts.map(q=>place(ins,q));   // seam allowance ≈ mean distance cut→sew
      let dsum=0,n=0;for(const q of pc.points){let bd=1e9;for(const s2 of sp){const dd=Math.hypot(s2.x-q.x,s2.y-q.y);if(dd<bd)bd=dd;}dsum+=bd;n++;}
      const sa=n?dsum/n:0;if(sa>0.5&&sa<60){pc.seam=Math.round(sa*100)/100;pc.sewLine=sp;report.sew++;}}
    for(const e of b.ents){const role=LAYER_MAP[e.layer];
      if(e===bnd||e===sew)continue;
      if(!role){report.unknownLayers[e.layer]=(report.unknownLayers[e.layer]||0)+1;continue;}
      if(role==="grain"&&e.etype==="LINE"){const a=place(ins,{x:e.x,y:e.y}),c=place(ins,{x:e.x2,y:e.y2});pc.grain={x1:a.x,y1:a.y,x2:c.x,y2:c.y};report.grains++;}
      else if((role==="internal"||role==="drill"||role==="mirror")&&(e.etype==="LINE"||e.etype==="POLY")){
        const segs=e.etype==="LINE"?[[{x:e.x,y:e.y},{x:e.x2,y:e.y2}]]:e.pts.slice(0,-1).map((q,k)=>[q,e.pts[k+1]]);
        for(const [a0,b0] of segs){const a=place(ins,a0),c=place(ins,b0);pc.internals.push({x1:a.x,y1:a.y,x2:c.x,y2:c.y});report.internals++;}}
      else if(role==="notch"){const q=e.etype==="LINE"?place(ins,{x:e.x,y:e.y}):place(ins,{x:e.x,y:e.y});
        let best=null,bd=6;for(let seg=0;seg<pc.points.length;seg++)for(let s=0;s<=SEG_STEPS;s++){const t=s/SEG_STEPS,pt=pointOnSegment(pc,seg,t);const dd=Math.hypot(pt.x-q.x,pt.y-q.y);if(dd<bd){bd=dd;best={seg,t};}}
        if(!best&&e.etype==="LINE"){const q2=place(ins,{x:e.x2,y:e.y2});for(let seg=0;seg<pc.points.length;seg++)for(let s=0;s<=SEG_STEPS;s++){const t=s/SEG_STEPS,pt=pointOnSegment(pc,seg,t);const dd=Math.hypot(pt.x-q2.x,pt.y-q2.y);if(dd<bd){bd=dd;best={seg,t};}}}
        if(best){pc.notches.push(best);report.notches++;}}
      else if((e.etype==="TEXT"||e.etype==="MTEXT")&&e.text){const m=e.text.match(/^\s*piece\s*name\s*:\s*(.+)$/i);
        if(m)pc.name=m[1].trim();else{const m2=e.text.match(/^\s*(quantity|category|size|annotation)\s*:\s*(.+)$/i);if(m2&&m2[1].toLowerCase()==="quantity"){const q=parseInt(m2[2]);if(q>0)pc.qty=q;}else pc.annotations.push(e.text);}report.texts++;}
      else if(e.etype==="ARC"||e.etype==="CIRCLE")report.unsupported[e.etype]=(report.unsupported[e.etype]||0)+1;}
    pat.pieces.push(pc);report.pieces++;all.push(...pc.points);
  }
  if(!pat.pieces.length)return showImportReport(report,fname,null);
  const bb=polyBBox(all);pat.pieces.forEach(pc=>transformPieceXY(pc,q=>({x:q.x-bb.x1,y:q.y-bb.y1})));
  pat.pieces.forEach(pc=>{if(pc.sewLine)pc.sewLine=pc.sewLine.map(q=>({x:q.x-bb.x1,y:q.y-bb.y1}));
    if(!pc.grain){const b2=polyBBox(samplePiece(pc));pc.grain={x1:(b2.x1+b2.x2)/2,y1:b2.y1+b2.h*.25,x2:(b2.x1+b2.x2)/2,y2:b2.y1+b2.h*.75};}});
  S.patterns.push(pat);S.activePatternId=pat.id;S.workspace="design";S.sel={piece:null,point:null,placement:null};
  fitView("design");render();showImportReport(report,fname,pat);
}

const CMD={
  "file.new":()=>{const np=newPattern("Untitled","M");S.patterns.push(np);S.activePatternId=np.id;S.sel={piece:null,point:null,placement:null};render();},
  "file.open":()=>openFile(".wptn,.wmrk,application/json"),

    if(S.msel&&S.msel.length){const by={};S.msel.forEach(s=>(by[s.pc]=by[s.pc]||[]).push(s.i));let n=0;
      for(const id in by){const q=p.pieces.find(x=>x.id===id);by[id].sort((a,b)=>b-a).forEach(i=>{if(q.points.length>3){q.points.splice(i,1);n++;}});q.notches=[];}
      S.msel=[];S.sel.point=null;render();toast(`Deleted ${n} point(s)`);return;}
    if(pc&&S.sel.point!=null){if(deletePoint(pc,S.sel.point)){S.sel.point=null;render();toast("Point deleted");}}
    else if(pc){p.pieces=p.pieces.filter(x=>x.id!==pc.id);S.sel.piece=null;S.sel.point=null;render();toast(`Deleted "${pc.name}"`);}},
  "piece.info":showPieceInfo,"piece.fliph":()=>flipPieces("h"),"piece.flipv":()=>flipPieces("v"),

  "piece.tograin":()=>{const pcs=targetPieces();for(const pc of pcs){const a=grainAngle(pc.grain);const d=((90-a)%360+360)%360;const r=rad(-d),c=Math.cos(r),s=Math.sin(r);const bb=polyBBox(samplePiece(pc)),cx=(bb.x1+bb.x2)/2,cy=(bb.y1+bb.y2)/2;transformPieceXY(pc,q=>({x:cx+(q.x-cx)*c-(q.y-cy)*s,y:cy+(q.x-cx)*s+(q.y-cy)*c}));}render();},
  "point.move":()=>{const pc=selPiece();if(!pc||S.sel.point==null)return toast("Select a point first");movePointDialog(pc,S.sel.point);},

  "tool.shape":()=>{const order=["rect","ellipse","roundrect"];if(S.tool==="shape"){S.shapeKind=order[(order.indexOf(S.shapeKind)+1)%order.length];}setTool("shape");},
  "tool.perp":()=>{if(S.tool==="perp"){S.perpBoth=!S.perpBoth;buildFloatTool();renderStats();}else setTool("perp");},
  "tool.linemirror":()=>setTool("linemirror"),"tool.piecemirror":()=>setTool("piecemirror"),"tool.notch":()=>setTool("notch"),
  "tool.grain":()=>setTool("grain"),"tool.smooth":()=>setTool("smooth"),"tool.measure":()=>setTool("measure"),
  "tool.curve":()=>{S.curveMode=!S.curveMode;buildFloatTool();renderStats();},
};
